<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZNK Studio - Plateforme d'Études Prépa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --dark-bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-emerald: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #0f172a, #1e293b, #334155);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }

        .studio-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.3);
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header {
            background: var(--primary-gradient);
            padding: 24px 32px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--success-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .header-controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        .btn:hover::before {
            left: 0;
        }

        .btn-primary {
            background: var(--success-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .course-info {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .info-card {
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            position: relative;
        }

        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.1);
            border-color: var(--accent-blue);
        }

        .info-card label {
            display: block;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-card input, .info-card select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .info-card input:focus, .info-card select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 24px;
            height: calc(100vh - 400px);
        }

        .editor-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            padding: 16px;
            background: var(--glass-bg);
            border-radius: 12px;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toolbar-section {
            display: flex;
            gap: 8px;
            padding-right: 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toolbar-section:last-child {
            border-right: none;
            padding-right: 0;
        }

        .toolbar-btn {
            padding: 8px 12px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .toolbar-btn:hover {
            background: var(--accent-blue);
            color: white;
            transform: scale(1.02);
        }

        .toolbar-btn.active {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .editor-area {
            flex: 1;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            font-size: 16px;
            line-height: 1.7;
            resize: none;
            outline: none;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: var(--glass-bg);
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .editor-area:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .znk-keyboard {
            background: var(--dark-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .keyboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .keyboard-header h3 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
        }

        .znk-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .znk-key {
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            font-size: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .znk-key::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .znk-key:hover::before {
            opacity: 1;
        }

        .znk-key:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
        }

        .znk-key:active {
            transform: translateY(-1px) scale(0.98);
        }

        .znk-key .label {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 500;
            text-align: center;
            margin-top: 2px;
        }

        .table-controls {
            background: var(--glass-bg);
            padding: 16px;
            border-radius: 12px;
            margin: 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .table-controls h4 {
            margin-bottom: 12px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .table-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .table-inputs input {
            width: 60px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-primary);
            text-align: center;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--glass-bg);
            border-radius: 8px;
            overflow: hidden;
            margin: 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .data-table th {
            background: var(--card-bg);
            font-weight: 600;
            color: var(--accent-blue);
        }

        .data-table tr:hover {
            background: rgba(59, 130, 246, 0.05);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            margin-top: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-emerald);
            animation: pulse 2s ease-in-out infinite;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            margin: 5% auto;
            padding: 32px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            animation: slideInScale 0.3s ease;
        }

        @keyframes slideInScale {
            from { transform: scale(0.9) translateY(30px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: var(--text-primary);
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            .znk-keyboard {
                order: 2;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .znk-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="particles" id="particles"></div>

    <div class="studio-container">
        <!-- En-tête -->
        <div class="header">
            <h1>
                <div class="logo-icon">⚡</div>
                ZNK Studio - Prépa Excellence
            </h1>
            <div class="header-controls">
                <button class="btn btn-secondary" onclick="openSettings()">⚙️ Paramètres</button>
                <button class="btn btn-secondary" onclick="exportData()">📊 Export</button>
                <button class="btn btn-primary" onclick="saveCourse()">💾 Sauvegarder</button>
            </div>
        </div>

        <!-- Informations du cours -->
        <div class="course-info">
            <div class="info-grid">
                <div class="info-card">
                    <label for="courseName">Nom du Module</label>
                    <input type="text" id="courseName" placeholder="Mathématiques - Analyse complexe">
                </div>
                <div class="info-card">
                    <label for="className">Niveau Prépa</label>
                    <select id="className">
                        <option value="">Sélectionner le niveau</option>
                        <option value="MPSI">MPSI</option>
                        <option value="PCSI">PCSI</option>
                        <option value="PTSI">PTSI</option>
                        <option value="MP">MP</option>
                        <option value="PC">PC</option>
                        <option value="PSI">PSI</option>
                        <option value="PT">PT</option>
                    </select>
                </div>
                <div class="info-card">
                    <label for="subject">Discipline</label>
                    <select id="subject">
                        <option value="">Sélectionner la matière</option>
                        <option value="Mathématiques">🧮 Mathématiques</option>
                        <option value="Physique">🔬 Physique</option>
                        <option value="Chimie">⚗️ Chimie</option>
                        <option value="SI">⚙️ Sciences Industrielles</option>
                        <option value="Informatique">💻 Informatique</option>
                        <option value="Français">📖 Français-Philo</option>
                    </select>
                </div>
                <div class="info-card">
                    <label for="duration">Durée (min)</label>
                    <input type="number" id="duration" placeholder="120" min="1" max="480">
                </div>
            </div>
        </div>

        <!-- Contenu principal -->
        <div class="main-content">
            <!-- Zone d'édition -->
            <div class="editor-section">
                <!-- Barre d'outils avancée -->
                <div class="toolbar">
                    <div class="toolbar-section">
                        <button class="toolbar-btn" onclick="formatText('bold')">📝 Gras</button>
                        <button class="toolbar-btn" onclick="formatText('italic')">📐 Italique</button>
                        <button class="toolbar-btn" onclick="formatText('code')">💾 Code</button>
                    </div>
                    <div class="toolbar-section">
                        <button class="toolbar-btn" onclick="insertFormula()">∑ Formule</button>
                        <button class="toolbar-btn" onclick="insertMatrix()">📊 Matrice</button>
                        <button class="toolbar-btn" onclick="insertGraph()">📈 Graphique</button>
                    </div>
                    <div class="toolbar-section">
                        <button class="toolbar-btn" onclick="showTableControls()">📋 Tableau</button>
                        <button class="toolbar-btn" onclick="insertDiagram()">🔄 Diagramme</button>
                        <button class="toolbar-btn" onclick="insertImage()">🖼️ Image</button>
                    </div>
                </div>

                <!-- Contrôles de tableau -->
                <div class="table-controls" id="tableControls" style="display: none;">
                    <h4>📊 Création de Tableau</h4>
                    <div class="table-inputs">
                        <label>Lignes: <input type="number" id="tableRows" value="3" min="1" max="20"></label>
                        <label>Colonnes: <input type="number" id="tableCols" value="3" min="1" max="10"></label>
                        <button class="btn btn-primary" onclick="createTable()">Créer Tableau</button>
                        <button class="btn btn-secondary" onclick="importExcel()">📁 Import Excel</button>
                    </div>
                </div>

                <!-- Zone d'écriture principale -->
                <textarea class="editor-area" id="courseEditor" placeholder="🚀 Bienvenue dans ZNK Studio !

📚 Modules d'études disponibles :
• Utilisation du clavier ZNK pour les symboles mathématiques et scientifiques
• Insertion de tableaux et graphiques
• Import de données Excel/CSV
• Templates prédéfinis pour chaque matière
• Formatage LaTeX intégré

💡 Conseils :
- Utilisez les emoji-boutons pour insérer rapidement du contenu structuré
- Ctrl+S pour sauvegarder
- Les formules mathématiques sont automatiquement formatées

Commencez votre cours ici..."></textarea>
            </div>

            <!-- Clavier ZNK -->
            <div class="znk-keyboard">
                <div class="keyboard-header">
                    <h3>⚡ ZNK Keyboard</h3>
                    <div>
                        <button class="btn btn-secondary" style="font-size: 12px; padding: 6px 12px;" onclick="switchKeyboardMode()">🔄 Mode</button>
                        <button class="btn btn-secondary" style="font-size: 12px; padding: 6px 12px;" onclick="openKeyboardSettings()">⚙️</button>
                    </div>
                </div>

                <!-- Grille ZNK principale -->
                <div class="znk-grid" id="znkGrid">
                    <!-- Les touches seront générées par JavaScript -->
                </div>

                <!-- Fonctions spécialisées -->
                <div class="specialized-functions" id="specialFunctions">
                    <!-- Sera peuplé dynamiquement selon le mode -->
                </div>
            </div>
        </div>

        <!-- Barre de statut -->
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="charCount">0 caractères</span> | 
                <span id="wordCount">0 mots</span> |
                <span id="tableCount">0 tableaux</span>
            </div>
            <div class="status-indicator">
                <span id="saveStatus">✨ ZNK Studio Ready</span>
            </div>
        </div>
    </div>

    <!-- Modal des paramètres -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('settingsModal')">&times;</span>
            <h3>⚙️ Paramètres ZNK Studio</h3>
            <div style="margin-top: 24px;">
                <div style="margin-bottom: 20px;">
                    <label>
                        <input type="checkbox" id="autoSave" checked> 
                        🔄 Sauvegarde automatique (30s)
                    </label>
                </div>
                <div style="margin-bottom: 20px;">
                    <label>
                        <input type="checkbox" id="latexMode" checked> 
                        📐 Mode LaTeX pour formules
                    </label>
                </div>
                <div style="margin-bottom: 20px;">
                    <label>
                        <input type="checkbox" id="darkMode" checked> 
                        🌙 Mode sombre
                    </label>
                </div>
                <div style="margin-bottom: 20px;">
                    <label>
                        Thème d'édition :
                        <select id="editorTheme" style="margin-left: 10px;">
                            <option value="default">Par défaut</option>
                            <option value="material">Material</option>
                            <option value="monokai">Monokai</option>
                            <option value="github">GitHub</option>
                        </select>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal du clavier -->
    <div class="modal" id="keyboardModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('keyboardModal')">&times;</span>
            <h3>⚙️ Configuration Clavier ZNK</h3>
            <div style="margin-top: 24px;">
                <div style="margin-bottom: 20px;">
                    <label>
                        Mode actif :
                        <select id="keyboardModeSelect" onchange="changeKeyboardMode()">
                            <option value="education">🎓 Éducation</option>
                            <option value="mathematics">🧮 Mathématiques</option>
                            <option value="physics">🔬 Physique</option>
                            <option value="chemistry">⚗️ Chimie</option>
                            <option value="programming">💻 Programmation</option>
                        </select>
                    </label>
                </div>
                <div style="margin-bottom: 20px;">
                    <h4>🎯 Touches personnalisées :</h4>
                    <div style="margin: 15px 0; display: flex; gap: 10px;">
                        <input type="text" id="customEmoji" placeholder="📚" style="width: 50px;">
                        <input type="text" id="customLabel" placeholder="Étiquette" style="flex: 1;">
                        <button class="btn btn-primary" onclick="addCustomKey()">➕ Ajouter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration ZNK Keyboard
        const ZNK_CONFIG = {
            "name": "ZNK_Keyboard",
            "columns": 5,
            "modes": {
                "education": {
                    "layout": [
                        { "emoji": "📚", "label": "Leçon", "code": "## 📚 LEÇON\n\n### Objectifs:\n- \n\n### Contenu:\n\n" },
                        { "emoji": "📝", "label": "Exercice", "code": "## 📝 EXERCICE\n\n**Énoncé:**\n\n**Solution:**\n\n" },
                        { "emoji": "🧮", "label": "Math", "code": "$$\\begin{align}\n\n\\end{align}$$" },

        let currentMode = 'education';
        let isRecording = false;
        let mediaRecorder;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            initializeParticles();
            initializeZNKKeyboard();
            setupEditor();
            loadSettings();
            
            const editor = document.getElementById('courseEditor');
            editor.addEventListener('input', updateStats);
            
            // Auto-sauvegarde
            setInterval(autoSave, 30000);
            updateStats();
        });

        // Animation de particules
        function initializeParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (3 + Math.random() * 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Initialisation du clavier ZNK
        function initializeZNKKeyboard() {
            updateKeyboardLayout(currentMode);
        }

        function updateKeyboardLayout(mode) {
            const grid = document.getElementById('znkGrid');
            const config = ZNK_CONFIG.modes[mode];
            
            grid.innerHTML = '';
            
            config.layout.forEach(key => {
                const keyElement = document.createElement('div');
                keyElement.className = 'znk-key';
                keyElement.innerHTML = `
                    <div class="emoji">${key.emoji}</div>
                    <div class="label">${key.label}</div>
                `;
                keyElement.onclick = () => insertZNKContent(key.code);
                grid.appendChild(keyElement);
            });
        }

        function insertZNKContent(content) {
            const editor = document.getElementById('courseEditor');
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            
            editor.value = editor.value.slice(0, start) + content + editor.value.slice(end);
            editor.selectionStart = editor.selectionEnd = start + content.length;
            editor.focus();
            
            updateStats();
            
            // Animation de feedback
            const event = new CustomEvent('znk-key-pressed');
            document.dispatchEvent(event);
        }

        // Configuration de l'éditeur
        function setupEditor() {
            const editor = document.getElementById('courseEditor');
            
            // Raccourcis clavier
            editor.addEventListener('keydown', function(e) {
                if (e.ctrlKey) {
                    switch(e.key) {
                        case 's':
                            e.preventDefault();
                            saveCourse();
                            break;
                        case 'e':
                            e.preventDefault();
                            exportData();
                            break;
                        case 'b':
                            e.preventDefault();
                            formatText('bold');
                            break;
                        case 'i':
                            e.preventDefault();
                            formatText('italic');
                            break;
                    }
                }
                
                // Tab pour indentation
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = editor.selectionStart;
                    editor.value = editor.value.slice(0, start) + '    ' + editor.value.slice(start);
                    editor.selectionStart = editor.selectionEnd = start + 4;
                }
            });
        }

        // Formatage du texte
        function formatText(format) {
            const editor = document.getElementById('courseEditor');
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selectedText = editor.value.slice(start, end);
            
            let formattedText;
            switch(format) {
                case 'bold':
                    formattedText = `**${selectedText}**`;
                    break;
                case 'italic':
                    formattedText = `*${selectedText}*`;
                    break;
                case 'code':
                    formattedText = `\`${selectedText}\``;
                    break;
                default:
                    formattedText = selectedText;
            }
            
            editor.value = editor.value.slice(0, start) + formattedText + editor.value.slice(end);
            editor.selectionStart = start;
            editor.selectionEnd = start + formattedText.length;
            editor.focus();
            updateStats();
        }

        // Insertion d'éléments spéciaux
        function insertFormula() {
            insertZNKContent('$\\begin{align}\n\n\\end{align}$');
        }

        function insertMatrix() {
            insertZNKContent('$\\begin{pmatrix}\na & b \\\\\nc & d\n\\end{pmatrix}$');
        }

        function insertGraph() {
            insertZNKContent('\n```graph\n# Données du graphique\nx = [1, 2, 3, 4, 5]\ny = [2, 4, 6, 8, 10]\n```\n');
        }

        function insertDiagram() {
            insertZNKContent('\n```mermaid\ngraph TD\n    A[Début] --> B[Étape 1]\n    B --> C[Étape 2]\n    C --> D[Fin]\n```\n');
        }

        function insertImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    insertZNKContent(`\n![${file.name}](${file.name})\n`);
                }
            };
            input.click();
        }

        // Gestion des tableaux
        function showTableControls() {
            const controls = document.getElementById('tableControls');
            controls.style.display = controls.style.display === 'none' ? 'block' : 'none';
        }

        function createTable() {
            const rows = parseInt(document.getElementById('tableRows').value);
            const cols = parseInt(document.getElementById('tableCols').value);
            
            let table = '\n| ';
            
            // En-têtes
            for (let j = 0; j < cols; j++) {
                table += `Colonne ${j + 1} | `;
            }
            table += '\n| ';
            
            // Séparateur
            for (let j = 0; j < cols; j++) {
                table += '--- | ';
            }
            table += '\n';
            
            // Lignes de données
            for (let i = 0; i < rows - 1; i++) {
                table += '| ';
                for (let j = 0; j < cols; j++) {
                    table += `Donnée ${i + 1}.${j + 1} | `;
                }
                table += '\n';
            }
            
            insertZNKContent(table + '\n');
            document.getElementById('tableControls').style.display = 'none';
        }

        function importExcel() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.xls,.csv';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    // Simulation d'import Excel
                    const tableData = `
| Nom | Note | Coefficient | Total |
| --- | --- | --- | --- |
| Math | 15 | 3 | 45 |
| Physique | 14 | 2 | 28 |
| Chimie | 16 | 2 | 32 |
| **TOTAL** | | | **105** |
`;
                    insertZNKContent(tableData);
                    alert('📊 Données Excel importées avec succès !');
                }
            };
            input.click();
        }

        // Changement de mode clavier
        function switchKeyboardMode() {
            const modes = Object.keys(ZNK_CONFIG.modes);
            const currentIndex = modes.indexOf(currentMode);
            const nextIndex = (currentIndex + 1) % modes.length;
            currentMode = modes[nextIndex];
            
            updateKeyboardLayout(currentMode);
            
            // Animation de transition
            const grid = document.getElementById('znkGrid');
            grid.style.transform = 'scale(0.9)';
            grid.style.opacity = '0.7';
            setTimeout(() => {
                grid.style.transform = 'scale(1)';
                grid.style.opacity = '1';
            }, 200);
        }

        function changeKeyboardMode() {
            currentMode = document.getElementById('keyboardModeSelect').value;
            updateKeyboardLayout(currentMode);
        }

        // Ajout de touches personnalisées
        function addCustomKey() {
            const emoji = document.getElementById('customEmoji').value;
            const label = document.getElementById('customLabel').value;
            
            if (emoji && label) {
                const customCode = `## ${emoji} ${label.toUpperCase()}\n\n`;
                
                // Ajouter à la configuration actuelle
                if (!ZNK_CONFIG.modes.custom) {
                    ZNK_CONFIG.modes.custom = { layout: [] };
                }
                
                ZNK_CONFIG.modes.custom.layout.push({
                    emoji: emoji,
                    label: label,
                    code: customCode
                });
                
                // Mettre à jour l'affichage si on est en mode custom
                if (currentMode === 'custom') {
                    updateKeyboardLayout(currentMode);
                }
                
                document.getElementById('customEmoji').value = '';
                document.getElementById('customLabel').value = '';
                
                alert(`✅ Touche "${emoji} ${label}" ajoutée !`);
            }
        }

        // Statistiques et sauvegarde
        function updateStats() {
            const editor = document.getElementById('courseEditor');
            const text = editor.value;
            const charCount = text.length;
            const wordCount = text.trim().split(/\s+/).filter(word => word.length > 0).length;
            const tableCount = (text.match(/\|.*\|/g) || []).length;
            
            document.getElementById('charCount').textContent = `${charCount} caractères`;
            document.getElementById('wordCount').textContent = `${wordCount} mots`;
            document.getElementById('tableCount').textContent = `${Math.floor(tableCount/3)} tableaux`;
            
            // Marquer comme non sauvegardé
            document.getElementById('saveStatus').textContent = '⚡ Modifications en cours...';
        }

        function saveCourse() {
            const courseData = {
                name: document.getElementById('courseName').value || 'Nouveau Module',
                class: document.getElementById('className').value,
                subject: document.getElementById('subject').value,
                duration: document.getElementById('duration').value,
                content: document.getElementById('courseEditor').value,
                mode: currentMode,
                timestamp: new Date().toISOString(),
                znk_version: "2.0"
            };
            
            // Créer le fichier de sauvegarde
            const courseJson = JSON.stringify(courseData, null, 2);
            const blob = new Blob([courseJson], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `ZNK_${courseData.name.replace(/\s+/g, '_')}_${Date.now()}.json`;
            a.click();
            
            URL.revokeObjectURL(url);
            document.getElementById('saveStatus').textContent = '✅ ZNK Studio Saved';
            
            // Animation de succès
            const header = document.querySelector('.header');
            header.style.background = 'var(--success-gradient)';
            setTimeout(() => {
                header.style.background = 'var(--primary-gradient)';
            }, 1000);
            
            showNotification('💾 Module sauvegardé avec succès !', 'success');
        }

        function autoSave() {
            if (document.getElementById('autoSave')?.checked) {
                const courseData = {
                    name: document.getElementById('courseName').value,
                    content: document.getElementById('courseEditor').value,
                    lastAutoSave: new Date().toISOString()
                };
                
                // Stockage temporaire
                localStorage.setItem('znk_autosave', JSON.stringify(courseData));
                document.getElementById('saveStatus').textContent = '🔄 Auto-sauvegardé';
            }
        }

        function exportData() {
            const courseName = document.getElementById('courseName').value || 'Module ZNK';
            const className = document.getElementById('className').value;
            const subject = document.getElementById('subject').value;
            const content = document.getElementById('courseEditor').value;
            
            // Export Markdown enrichi
            const exportContent = `# ${courseName}
*Niveau :* **${className}** | *Matière :* **${subject}**  
*Date :* ${new Date().toLocaleDateString('fr-FR')} | *ZNK Studio v2.0*

---

${content}

---

## 📊 Métadonnées du Module

| Propriété | Valeur |
|-----------|--------|
| Mode Clavier | ${currentMode} |
| Caractères | ${document.getElementById('charCount').textContent} |
| Mots | ${document.getElementById('wordCount').textContent} |
| Tableaux | ${document.getElementById('tableCount').textContent} |

---

*📚 Généré avec ZNK Studio - Excellence en Prépa*  
*⚡ Plateforme d'études avancée pour classes préparatoires*
            `;
            
            const blob = new Blob([exportContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `ZNK_Export_${courseName.replace(/\s+/g, '_')}.md`;
            a.click();
            
            URL.revokeObjectURL(url);
            showNotification('📤 Export réalisé avec succès !', 'success');

        // Modals
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'block';
        }

        function openKeyboardSettings() {
            document.getElementById('keyboardModal').style.display = 'block';
            document.getElementById('keyboardModeSelect').value = currentMode;
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Notifications
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'success' ? 'var(--success-gradient)' : 'var(--primary-gradient)'};
                color: white;
                padding: 16px 24px;
                border-radius: 12px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
                z-index: 10000;
                font-weight: 600;
                opacity: 0;
                transform: translateX(100%);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // Animation d'entrée
            setTimeout(() => {
                notification.style.opacity = '1';
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            // Animation de sortie
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // Chargement des paramètres
        function loadSettings() {
            try {
                const autosave = localStorage.getItem('znk_autosave');
                if (autosave) {
                    const data = JSON.parse(autosave);
                    if (confirm('🔄 Données auto-sauvegardées trouvées. Les restaurer ?')) {
                        document.getElementById('courseName').value = data.name || '';
                        document.getElementById('courseEditor').value = data.content || '';
                        updateStats();
                    }
                }
            } catch (e) {
                console.log('Aucune sauvegarde automatique trouvée');
            }
        }

        // Événements globaux
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F1') {
                e.preventDefault();
                showNotification('⚡ ZNK Studio - Raccourcis: Ctrl+S (sauver), Ctrl+E (export), F2 (paramètres)', 'info');
            }
            
            if (e.key === 'F2') {
                e.preventDefault();
                openSettings();
            }
        });

        // Fermeture des modals
        window.onclick = function(event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        };

        // Animation d'accueil
        window.addEventListener('load', function() {
            setTimeout(() => {
                showNotification('⚡ ZNK Studio Activé - Prêt pour l\'excellence !', 'success');
            }, 1500);
        });

        // Gestion du drag & drop
        const editor = document.getElementById('courseEditor');
        
        editor.addEventListener('dragover', function(e) {
            e.preventDefault();
            editor.style.borderColor = 'var(--accent-blue)';
            editor.style.boxShadow = '0 0 0 3px rgba(59, 130, 246, 0.1)';
        });
        
        editor.addEventListener('dragleave', function(e) {
            e.preventDefault();
            editor.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            editor.style.boxShadow = 'none';
        });
        
        editor.addEventListener('drop', function(e) {
            e.preventDefault();
            editor.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            editor.style.boxShadow = 'none';
            
            const files = e.dataTransfer.files;
            for (let file of files) {
                if (file.type.startsWith('image/')) {
                    insertZNKContent(`\n![${file.name}](${file.name})\n`);
                } else if (file.type === 'text/plain' || file.name.endsWith('.md')) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        insertZNKContent('\n' + event.target.result + '\n');
                    };
                    reader.readAsText(file);
                }
            }
        });
