# /etc/nginx/sites-available/znk-backend
# Remplace api.tondomaine.com par ton vrai (sous-)domaine

server {
    listen 80;
    server_name api.tondomaine.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Après avoir lancé certbot (voir guide), il ajoutera automatiquement
# le bloc HTTPS (listen 443 ssl) ici même.
