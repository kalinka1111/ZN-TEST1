<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>©ZNK - Dashboard Unifié</title>
    <style>
        /* ==========================================
           RESET & VARIABLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --znk-bg-primary: #000000;
            --znk-bg-secondary: #606060;
            --znk-bg-card: #444444;
            --znk-accent: #929292;
            --znk-accent-hover: #7a7a7a;
            --znk-text-primary: #ffffff;
            --znk-text-secondary: #c0c0c0;
            --znk-text-muted: #606060;
            --znk-border: #606060;
            --znk-glass: #232323;
            --znk-success: #238636;
            --znk-warning: #d29922;
            --znk-danger: #da3633;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #0a0e17 0%, #1a1f35 50%, #444444 100%);
            color: var(--znk-text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            background: var(--znk-glass);
            backdrop-filter: blur(40px);
            border-bottom: 1px solid var(--znk-border);
            padding: 12px 16px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--znk-accent);
            cursor: pointer;
        }

        .search-container {
            position: relative;
            width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 8px 16px 8px 40px;
            background: var(--znk-bg-card);
            border: 1px solid var(--znk-border);
            border-radius: 20px;
            color: var(--znk-text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--znk-accent);
            box-shadow: 0 0 0 2px #212121;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--znk-bg-card);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            overflow: hidden;
            position: relative;
        }

        .header-btn:hover {
            background: var(--znk-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px #0f0e0e;
        }

        .header-btn img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        /* Variante rectangulaire pour le bouton Studios : plus large,
           coins arrondis au lieu du cercle, pour se démarquer des
           autres icônes rondes du header (messages, notifications...) */
        .header-btn.studio {
            width: 75px;
            height: 43px;
            border-radius: 12px;
        }

        .header-btn.studio img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .user-avatar-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--znk-accent), #667eea);
            border: 2px solid #444444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .user-avatar-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #444444;
        }

        .user-avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* LAYOUT PRINCIPAL */
        .main-layout {
            margin-top: 60px;
            display: grid;
            grid-template-columns: 120px 1fr 380px;
            gap: 24px;
            padding: 24px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
            transition: grid-template-columns 0.3s ease;
            height: calc(100vh - 84px);
        }

        .main-layout.no-sidebar-right {
            grid-template-columns: 120px 1fr;
        }

        /* SIDEBAR GAUCHE */
        .sidebar-left {
            position: sticky;
            top: 80px;
            height: fit-content;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .nav-section {
            background: var(--znk-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 12px;
            color: var(--znk-text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #444444;
            transform: scale(1.05);
            box-shadow: 0 4px 12px #444444;
        }

        .icon-placeholder {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            background: linear-gradient(135deg, #444444, rgba(16,185,129,0.06));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #444444;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .icon-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: inherit;
        }

        .icon-placeholder[data-role="user-p"] {
            cursor: pointer;
            border: 2px solid #444444;
        }

        .icon-placeholder[data-role="user-profile"]:hover {
            border-color: var(--znk-accent);
            box-shadow: 0 0 20px #444444;
        }

        /* MODULE CONTAINER */
        .module-container {
            background: var(--znk-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border);
            border-radius: 16px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #moduleContainer {
            width: 100%;
            flex: 1;
            overflow: hidden;
            padding: 0;
            position: relative;
        }

        #moduleContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            display: block;
        }

        .module-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--znk-border);
            border-top-color: var(--znk-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner-text {
            margin-top: 16px;
            color: var(--znk-text-secondary);
            font-size: 14px;
        }

        /* SIDEBAR DROITE */
        .sidebar-right {
            position: sticky;
            top: 80px;
            height: fit-content;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .sidebar-right.hidden {
            display: none;
        }

        .widget {
            background: var(--znk-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .widget-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--znk-accent);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .widget-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .widget-item:hover { background: #444444; }

        .widget-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--znk-accent), #7a7a7a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 14px;
            overflow: hidden;
        }

        .widget-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .widget-info { flex: 1; }
        .widget-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .widget-desc { font-size: 11px; color: var(--znk-text-muted); }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .main-layout {     
                  grid-template-columns: 1fr 320px; /* Garde la sidebar droite */
         }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 80px 1fr; padding: 12px; gap: 12px; }
            .icon-placeholder { width: 55px; height: 55px; }
        }

       @media (max-width: 768px) {
    .main-layout {
        grid-template-columns: 1fr; /* Mobile = tout en colonne */
    }
            .sidebar-left {
                position: fixed; bottom: 0; left: 0; right: 0; top: auto;
                width: 100%; height: auto; z-index: 900;
                background: var(--znk-glass); border-top: 1px solid var(--znk-border);
            }
            .nav-section { flex-direction: row; flex-wrap: wrap; justify-content: center; margin-bottom: 0; }
            .icon-placeholder { width: 50px; height: 50px; }
            .search-container, #statTime { display: none; }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #444444; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--znk-accent); }
    </style>
<script src="/js/znk-session.js"></script>

</head>

      // Charger un module - AVEC GESTION SIDEBAR DROITE
function loadModule(moduleName) {
    console.log('📂 Chargement du module:', moduleName);
    
    const container = document.getElementById('moduleContainer');
    const sidebarRight = document.querySelector('.sidebar-right');
    const mainLayout = document.querySelector('.main-layout');
    
    // DIAGNOSTIC COMPLET
    console.log('🔍 Diagnostic sidebar droite:');
    console.log('  - sidebarRight existe?', !!sidebarRight);
    console.log('  - mainLayout existe?', !!mainLayout);
    if (sidebarRight) {
        console.log('  - Classes actuelles:', sidebarRight.className);
        console.log('  - Style display actuel:', sidebarRight.style.display);
        console.log('  - Computed display:', window.getComputedStyle(sidebarRight).display);
    }
    
    // AFFICHER la sidebar droite UNIQUEMENT pour user-profile
    if (moduleName === 'user-profile') {
        console.log('👤 User Profile détecté - Affichage sidebar droite');
        
        if (sidebarRight) {
            // Retirer TOUTES les classes qui pourraient masquer
            sidebarRight.classList.remove('hidden');
            sidebarRight.classList.remove('d-none');
            
            // Forcer l'affichage avec !important via style inline
            sidebarRight.style.display = 'block';
            sidebarRight.style.visibility = 'visible';
            sidebarRight.style.opacity = '1';

<script>
// === RÉSOLUTION BACKEND LOCAL (même mécanisme que WhatsZNK.html) ===
const ZNK_BACKEND_STORAGE_KEY = 'znk_backend_url';
function znkResolveBackendUrl() {
    const params = new URLSearchParams(window.location.search);
    const fromUrl = params.get('backend');
    if (fromUrl) {
        localStorage.setItem(ZNK_BACKEND_STORAGE_KEY, fromUrl);
        return fromUrl;
    }
    return localStorage.getItem(ZNK_BACKEND_STORAGE_KEY) || 'http://localhost:5001';
}
const ZNK_BACKEND_URL = znkResolveBackendUrl();
if (window.electronAPI && window.electronAPI.getRegistryUrl) {
    window.electronAPI.getRegistryUrl().then(url => {
        if (url && localStorage.getItem(ZNK_BACKEND_STORAGE_KEY) !== url) {
            localStorage.setItem(ZNK_BACKEND_STORAGE_KEY, url);
        }
    }).catch(() => {});
}

// === SYSTÈME DE PERSISTANCE AUTOMATIQUE ===

class ZNKAdminPersistence {
    constructor() {
        // ⚠️ Ancienne détection : typeof window.electron !== 'undefined'.
        // window.electron n'existe QUE en mode legacy (ZNK_ALLOW_LEGACY=1,
        // contextIsolation:false). En mode normal (contextIsolation:true,
        // notre cas), window.electron est TOUJOURS undefined → isElectron
        // était TOUJOURS false, et toute la persistance filesystem
        // ci-dessous ne s'exécutait donc jamais, sans aucune erreur visible
        // (repli silencieux sur localStorage uniquement).
        this.isElectron = typeof window.electronAPI !== 'undefined';
        this.autoSaveEnabled = true;
        this.pendingPublications = [];
        
        console.log('🔧 ZNK Admin Persistence initialisé');
        console.log('   Electron:', this.isElectron);
        
        this.init();
    }

    init() {
        // Intercepter tous les événements de création de contenu
        this.setupContentInterceptors();
        
        // Auto-save périodique
        if (this.autoSaveEnabled) {
            this.startAutoSave();
        }
        
        // Listener pour messages des iframes
        window.addEventListener('message', (event) => {
            this.handleIframeMessage(event);
        });

        // Récupère depuis le VPS tout ce qui a déjà été publié ailleurs
        // (ou lors d'une install précédente) — rend les publications
        // persistantes même après une réinstallation propre de l'app.
        this.syncFromVPS();
    }

    // === SYNCHRONISATION VPS (persistance au-delà de ce device) ===

    async syncFromVPS() {
        try {
            const response = await fetch(`${ZNK_BACKEND_URL}/api/admin-content/sync-pull`);
            if (!response.ok) return; // VPS injoignable : on garde ce qu'on a déjà en local, silencieusement
            const result = await response.json();
            if (result.status !== 'success' || !Array.isArray(result.items)) return;

            for (const item of result.items) {
                // Ne pas écraser une version locale plus récente au même id
                const backupKey = `znk_backup_${item.type}_${item.id}`;
                if (localStorage.getItem(backupKey)) continue;
                localStorage.setItem(backupKey, JSON.stringify(item));

                if (item.type === 'video' && item.data) {
                    saveACTVVideo(item.data);
                } else if (item.type === 'gallery' && item.data) {
                    localStorage.setItem('znk_gallery_manifest', JSON.stringify(item.data));
                }
            }
            console.log(`✅ ${result.items.length} publication(s) synchronisée(s) depuis le VPS`);
        } catch (error) {
            // Hors-ligne ou VPS injoignable : comportement normal, on continue avec le local
            console.log('ℹ️ Sync VPS non disponible pour le moment (hors-ligne ?)');
        }
    }

    async pushToVPS(publication) {
        try {
            const response = await fetch(`${ZNK_BACKEND_URL}/api/admin-content/${publication.id}/sync-push`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(publication)
            });
            if (response.ok) {
                console.log('☁️ Publication synchronisée vers le VPS :', publication.id);
            } else {
                console.warn('⚠️ Échec sync VPS (statut', response.status, ') — reste en local pour l\'instant');
            }
        } catch (error) {
            // Hors-ligne : la publication reste en local (localStorage / filesystem),
            // ce n'est pas une erreur bloquante pour l'utilisateur
            console.log('ℹ️ Pas de réseau — publication gardée en local uniquement');
        }
    }

    // === INTERCEPTEURS ===

    setupContentInterceptors() {
        // Intercepter localStorage
        const originalSetItem = localStorage.setItem;
        
        localStorage.setItem = (key, value) => {
            originalSetItem.call(localStorage, key, value);
            
            // Détecter nouvelles publications
            if (key.includes('actv_published_videos') ||
                key.includes('audio_manager_files') ||
                key.includes('znk_content_')) {
                
                console.log('📤 Nouvelle publication détectée:', key);
                this.handleNewPublication(key, value);
            }
        };

        console.log('✅ Intercepteurs localStorage actifs');
    }

    // === GESTION DES PUBLICATIONS ===

    async handleNewPublication(key, value) {
        try {
            const data = JSON.parse(value);
            
            // Déterminer le type de contenu
            let contentType = 'content';
            if (key.includes('video')) contentType = 'video';
            else if (key.includes('audio')) contentType = 'audio';
            
            // Créer la structure de publication
            const publication = {
                id: `znk_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                type: contentType,
                title: this.extractTitle(data),
                data: data,
                source: key,
                createdAt: new Date().toISOString(),
                persistent: true
            };
            
            // Sauvegarder
            await this.savePublication(publication);
            
            // Ajouter à la liste des publications en attente
            this.pendingPublications.push(publication);
            
            // Notifier
            this.showNotification(`✅ ${contentType} sauvegardé : ${publication.title}`);
            
        } catch (error) {
            console.error('Erreur traitement publication:', error);
        }
    }

    async savePublication(publication) {
        // Sauvegarder en localStorage (backup)
        const backupKey = `znk_backup_${publication.type}_${publication.id}`;
        localStorage.setItem(backupKey, JSON.stringify(publication));

        // Synchronise vers le VPS — best-effort, ne bloque jamais l'utilisateur
        // si hors-ligne (voir pushToVPS : échoue silencieusement dans ce cas)
        this.pushToVPS(publication);
        
        // Si Electron, sauvegarder dans filesystem
        if (this.isElectron) {
            try {
                const result = await window.electronAPI.savePersistentContent({
                    content: publication,
                    targetPath: `./persistent-${publication.type}s/`
                });
                
                if (result.success) {
                    console.log('💾 Sauvegarde filesystem réussie:', result.path);
                    return true;
                } else {
                    console.warn('⚠️ Erreur sauvegarde filesystem:', result.error);
                }
            } catch (error) {
                console.error('❌ Erreur appel IPC:', error);
            }
        }
        
        return false;
    }

    extractTitle(data) {
        // Extraire un titre intelligent depuis les données
        if (Array.isArray(data) && data.length > 0) {
            const first = data[0];
            return first.title || first.name || first.filename || 'Sans titre';
        }
        
        if (typeof data === 'object' && data !== null) {
            return data.title || data.name || data.filename || 'Sans titre';
        }
        
        return 'Sans titre';
    }

    // === MESSAGES DEPUIS IFRAMES ===

    handleIframeMessage(event) {
        const { type, data } = event.data;
        
        if (!type) return;
        
        console.log('📨 Message iframe reçu:', type);
        
        switch (type) {
            case 'publish_video':
                this.handleVideoPublish(data);
                break;
                
            case 'publish_audio':
                this.handleAudioPublish(data);
                break;
                
            case 'save_content':
                this.handleContentSave(data);
                break;

            case 'publish_gallery':
                this.handleGalleryPublish(data);
                break;
                
            case 'request_sync':
                this.syncAll();
                break;
        }
    }

    async handleGalleryPublish(manifest) {
        console.log('🖼️ Publication galerie:', (manifest.artworks || []).length, 'œuvres');

        // Backup localStorage (utile aussi pour que gallery.html le lise en direct)
        localStorage.setItem('znk_gallery_manifest', JSON.stringify(manifest));

        // Synchronise vers le VPS — même schéma unifié que les autres types
        this.pushToVPS({
            id: `znk_gallery_${Date.now()}`,
            type: 'gallery',
            title: 'Galerie',
            data: manifest,
            source: 'znk_gallery_manifest',
            createdAt: new Date().toISOString(),
            persistent: true
        });

        // Sauvegarde fichier si Electron dispo (même pattern que videos/audio)
        if (this.isElectron) {
            try {
                const result = await window.electronAPI.saveManifest({
                    type: 'gallery',
                    manifest: manifest
                });
                if (result && result.success === false) {
                    console.warn('⚠️ Erreur sauvegarde fichier galerie:', result.error);
                }
            } catch (error) {
                console.error('❌ Erreur IPC save-manifest (gallery):', error);
            }
        }

        this.showNotification(`✅ Galerie publiée : ${(manifest.artworks || []).length} œuvre(s)`);
    }

    async handleVideoPublish(videoData) {
        console.log('📹 Publication vidéo:', videoData.title);
        
        const publication = {
            id: videoData.id || `video_${Date.now()}`,
            type: 'video',
            title: videoData.title || 'Vidéo sans titre',
            description: videoData.description || '',
            filename: videoData.filename || `${videoData.id}.mp4`,
            thumbnail: videoData.thumbnail,
            duration: videoData.duration,
            size: videoData.size,
            dashboard: 'actv',
            category: videoData.category || 'general',
            data: videoData,
            createdAt: new Date().toISOString(),
            persistent: true
        };
        
        await this.savePublication(publication);
        await this.updateVideoManifest(publication);
        
        this.showNotification(`✅ Vidéo publiée : ${publication.title}`);
    }

    async handleAudioPublish(audioData) {
        console.log('🎵 Publication audio:', audioData.title);
        
        const publication = {
            id: audioData.id || `audio_${Date.now()}`,
            type: 'audio',
            title: audioData.title || 'Audio sans titre',
            filename: audioData.filename || `${audioData.id}.mp3`,
            duration: audioData.duration,
            size: audioData.size,
            data: audioData,
            createdAt: new Date().toISOString(),
            persistent: true
        };
        
        await this.savePublication(publication);
        await this.updateAudioManifest(publication);
        
        this.showNotification(`✅ Audio publié : ${publication.title}`);
    }

    async handleContentSave(contentData) {
        console.log('📝 Sauvegarde contenu:', contentData.type);
        
        const publication = {
            id: contentData.id || `content_${Date.now()}`,
            type: 'content',
            contentType: contentData.type,
            title: contentData.title || 'Contenu sans titre',
            data: contentData,
            createdAt: new Date().toISOString(),
            persistent: true
        };
        
        await this.savePublication(publication);
        
        this.showNotification(`✅ Contenu sauvegardé : ${publication.title}`);
    }

    // === GESTION MANIFESTS ===

    async updateVideoManifest(video) {
        // Charger manifest existant
        let manifest = this.loadLocalManifest('videos');
        
        if (!manifest) {
            manifest = {
                version: '2.0.0',
                generated: new Date().toISOString(),
                source: './persistent-videos/znk-videos-manifest.json',
                persistent: true,
                videos: []
            };
        }
        
        // Ajouter la vidéo
        manifest.videos.push({
            id: video.id,
            title: video.title,
            description: video.description,
            filename: video.filename,
            size: video.size,
            type: 'video/mp4',
            dashboard: video.dashboard || 'actv',
            category: video.category || 'general',
            persistent: true,
            addedAt: video.createdAt
        });
        
        manifest.generated = new Date().toISOString();
        
        // Sauvegarder
        this.saveLocalManifest('videos', manifest);
        
        if (this.isElectron) {
            await window.electronAPI.saveManifest({
                type: 'videos',
                manifest: manifest
            });
        }
        
        console.log('✅ Manifest vidéos mis à jour');
    }

    async updateAudioManifest(audio) {
        let manifest = this.loadLocalManifest('audio');
        
        if (!manifest) {
            manifest = {
                version: '1.0.0',
                generated: new Date().toISOString(),
                source: './persistent-audio/znk-audio-manifest.json',
                audios: []
            };
        }
        
        manifest.audios.push({
            id: audio.id,
            title: audio.title,
            filename: audio.filename,
            duration: audio.duration,
            size: audio.size,
            addedAt: audio.createdAt
        });
        
        manifest.generated = new Date().toISOString();
        
        this.saveLocalManifest('audio', manifest);
        
        if (this.isElectron) {
            await window.electronAPI.saveManifest({
                type: 'audio',
                manifest: manifest
            });
        }
        
        console.log('✅ Manifest audio mis à jour');
    }

    loadLocalManifest(type) {
        const key = `znk_${type}_manifest`;
        const stored = localStorage.getItem(key);
        return stored ? JSON.parse(stored) : null;
    }

    saveLocalManifest(type, manifest) {
        const key = `znk_${type}_manifest`;
        localStorage.setItem(key, JSON.stringify(manifest));
    }

    // === SYNCHRONISATION ===

    async syncAll() {
        console.log('🔄 Synchronisation complète...');
        
        if (!this.isElectron) {
            console.warn('⚠️ Sync filesystem requiert Electron');
            this.showNotification('⚠️ Sync disponible uniquement en mode Electron');
            return;
        }
        
        try {
            const result = await window.electronAPI.syncToBuild({
                sourcePaths: {
                    videos: './persistent-videos/',
                    audio: './persistent-audio/',
                    content: './crystallized-content/'
                },
                buildPath: '../znk-electron-app/'
            });
            
            if (result.success) {
                console.log(`✅ Sync réussie : ${result.filesCopied} fichiers`);
                this.showNotification(`✅ ${result.filesCopied} fichiers synchronisés`);
                
                // Vider les publications en attente
                this.pendingPublications = [];
            } else {
                console.error('❌ Erreur sync:', result.error);
                this.showNotification('❌ Erreur de synchronisation');
            }
            
        } catch (error) {
            console.error('❌ Erreur sync:', error);
            this.showNotification('❌ Erreur de synchronisation');
        }
    }

    // === AUTO-SAVE ===

    startAutoSave() {
        // Auto-save toutes les 5 minutes
        setInterval(() => {
            if (this.pendingPublications.length > 0) {
                console.log(`📦 Auto-save: ${this.pendingPublications.length} publications en attente`);
                this.syncAll();
            }
        }, 5 * 60 * 1000);
        
        console.log('✅ Auto-save activé (toutes les 5 min)');
    }

    // === NOTIFICATIONS ===

    showNotification(message) {
        // Créer une notification visuelle
        const notification = document.createElement('div');
        notification.style.cssText = `
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, #00ff88, #0088ff);
            color: #000;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 10000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,255,136,0.5);
        `;
        
        notification.textContent = message;
        document.body.appendChild(notification);
        
        // Supprimer après 3 secondes
        setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => notification.remove(), 300);
        }, 3000);
        
        console.log('📢', message);
    }

    // === STATUS ===

    getStatus() {
        return {
            isElectron: this.isElectron,
            autoSaveEnabled: this.autoSaveEnabled,
            pendingPublications: this.pendingPublications.length,
            publications: this.pendingPublications
        };
    }
}

    console.log('✅ ZNK Admin Persistence prêt');

// === CONTRÔLES UI (optionnel) ===

function addPersistenceControls() {
    const headerRight = document.querySelector('.header-right');
    
    if (!headerRight) return;
    
    // Bouton Sync
    const syncBtn = document.createElement('button');
    syncBtn.className = 'header-btn';
    syncBtn.title = 'Synchroniser vers Build';
    syncBtn.innerHTML = '<span style="font-size:20px">🔄</span>';
    syncBtn.onclick = () => {
        if (znkPersistence) {
            znkPersistence.syncAll();
        }
    };
    
    // Bouton Status
    const statusBtn = document.createElement('button');
    statusBtn.className = 'header-btn';
    statusBtn.title = 'Status Persistance';
    statusBtn.innerHTML = '<span style="font-size:20px">📊</span>';
    statusBtn.onclick = () => {
        if (znkPersistence) {
            const status = znkPersistence.getStatus();
            console.log('📊 Status:', status);
            alert(`Persistance Status:\n\nElectron: ${status.isElectron}\nAuto-save: ${status.autoSaveEnabled}\nEn attente: ${status.pendingPublications}`);
        }
    };
    
    // Insérer avant l'avatar
    const userAvatar = document.getElementById('userAvatar');
    // userAvatar n'est pas un enfant DIRECT de headerRight (il est dans un
    // wrapper intermédiaire avec #statTime) : insertBefore exige un enfant
    // direct comme référence, donc on remonte au wrapper si besoin.
    const insertionRef = userAvatar && userAvatar.parentElement === headerRight
        ? userAvatar
        : (userAvatar ? userAvatar.parentElement : null);

    if (insertionRef && insertionRef.parentElement === headerRight) {
        headerRight.insertBefore(statusBtn, insertionRef);
        headerRight.insertBefore(syncBtn, insertionRef);
    } else {
        // Repli sûr : ajouter simplement à la fin plutôt que planter
        headerRight.appendChild(syncBtn);
        headerRight.appendChild(statusBtn);
    }
}
