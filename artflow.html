<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtFlow - Mes Créations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #000000 0%, #001e57 100%);
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        .main-container {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .site-header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 0 10px 0;
        }

        .site-header img {
            height: 110px;
            width: auto;
        }

        .central-screen {
            width: 90%;
            max-width: 1200px;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .connection-status, .playlist-indicator {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 10px 0 80px 0;
        }

        .popular-shows {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        .show-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.4s ease;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .show-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .show-card.now-playing {
            border: 2px solid #fbbf24;
            background: rgba(251, 191, 36, 0.2);
        }

        .show-thumbnail {
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .show-thumbnail video, .show-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .show-thumbnail.type-user-content {
            background: linear-gradient(45deg, #000000 0%, #001e57 100%);
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .show-card:hover .play-overlay { opacity: 1; }

        .play-btn-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #333;
        }

        .play-btn-icon::before {
            content: '▶';
            margin-left: 3px;
        }

        .now-playing-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fbbf24;
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            z-index: 10;
        }

        .user-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #000000;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            z-index: 10;
        }

        .show-title {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0 8px 0;
        }

        .show-stats {
            font-size: 14px;
            color: #cccccc;
            display: flex;
            justify-content: space-between;
        }

        .sound-control {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border: 2px solid #fbbf24;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            z-index: 20;
            transition: all 0.3s;
        }

        .sound-control:hover {
            background: #fbbf24;
            color: #000;
            transform: scale(1.1);
        }

        .sound-control.muted::before { content: '🔇 '; }
        .sound-control.unmuted::before { content: '🔊 '; }

        /* Contrôle de volume général (unique, remplace le bouton par vidéo) */
        .global-volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(251, 191, 36, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .global-volume-control button {
            background: none;
            border: none;
            color: #fbbf24;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }

        .global-volume-control input[type="range"] {
            width: 80px;
            accent-color: #fbbf24;
            cursor: pointer;
        }

        .artflow-logo {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00364a;
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 200;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #ddd;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading-indicator {
            text-align: center;
            padding: 40px;
            color: #fbbf24;
            font-size: 14px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .show-card {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .show-card:nth-child(1) { animation-delay: 0.1s; }
        .show-card:nth-child(2) { animation-delay: 0.2s; }
        .show-card:nth-child(3) { animation-delay: 0.3s; }
        .show-card:nth-child(4) { animation-delay: 0.4s; }
        .show-card:nth-child(5) { animation-delay: 0.5s; }
        .show-card:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="site-header">
            <img src="./icons/logo-artflow.svg" alt="ArtFlow logo">
        </div>
        <div class="content-area">
            <div class="central-screen">
                <div class="connection-status">
                    <span>🎨 ArtFlow - Mes Créations</span>
                </div>
                <div class="global-volume-control">
                    <button id="globalMuteBtn" onclick="toggleGlobalMute()">🔇</button>
                    <input type="range" id="globalVolumeSlider" min="0" max="100" value="80" oninput="onGlobalVolumeChange(this.value)">
                </div>
                <div class="playlist-indicator" id="playlistIndicator">
                    <span>🎬 <span id="publicationCount">0</span> publications</span>
                </div>
            </div>

            <!-- Lecteur principal -->
            <div id="mainPlayer" style="display: none; width: 90%; max-width: 1200px; margin: 20px auto; background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
                <div style="position: relative; padding-bottom: 56.25%; background: #000;">
                    <video id="mainVideo" controls controlsList="novolume nodownload noremoteplayback" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;"></video>
                </div>
                <div style="padding: 20px; background: #00364a;">
                    <h2 id="mainPlayerTitle" style="margin-bottom: 10px;"></h2>
                    <div id="mainPlayerStats" style="color: #ddd; font-size: 14px;"></div>
                    <button onclick="closeMainPlayer()" style="margin-top: 15px; padding: 10px 20px; background: #ef4444; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: 600;">
                        ✕ Fermer
                    </button>
                </div>
            </div>

            <!-- Grille publications -->
            <div class="popular-shows" id="popularShows">
                <div class="loading-indicator">📡 Chargement de vos publications...</div>
            </div>

            <!-- Empty state -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">🎨</div>
                <div style="font-size: 24px; margin-bottom: 12px;">Aucune publication pour le moment</div>
                <div style="font-size: 14px; color: #ccc;">
                    Publiez vos créations depuis artflowUserPublish.html
                </div>
            </div>
        </div>

        <div class="artflow-logo">ArtFlow</div>
    </div>

    <script>
        // Navigation dans iframe
        function navigateInDashboard(url) {
            if (window.parent && window.parent !== window && window.parent.location.href !== window.location.href) {
                window.parent.postMessage({ type: 'navigate', url: url }, '*');
            } else {
                window.location.href = url;
            }
        }

        // Contenu PARTAGÉ (visible par tous) : voir le même mécanisme dans
        // ZNK-LIVREmoi.html / ZNKLibrairie.html — vide = local uniquement.
        const ZNK_CLOUD_URL = (function(){
            try{ return localStorage.getItem('znk_cloud_url') || ''; }catch(e){ return ''; }
        })();
        function znkCloudPath(path){ return (ZNK_CLOUD_URL || '') + path; }

        // Les posts distants renvoient une URL relative au VPS (ex: /files/artflow_xxx.webm,
        // voir upload_artflow_video côté server.py) — il faut la résoudre contre
        // ZNK_CLOUD_URL, sinon le navigateur la résout contre l'origine de CETTE page
        // (artflow.html) et rate systématiquement le fichier. Les posts locaux (chemin
        // file:// ou déjà absolu) ne sont jamais touchés.
        function resolveVideoUrl(pub) {
            const url = pub && pub.videoUrl;
            if (!url) return url;
            if (pub.isRemote && url.startsWith('/')) return znkCloudPath(url);
            return url;
        }

        // Déduit le type MIME depuis l'extension réelle du fichier plutôt que de
        // supposer video/mp4 : les vidéos converties côté studio sont désormais en
        // WebM (VP9/Opus), voir convertVideo dans main.js.
        function videoMimeType(url) {
            if (!url) return 'video/mp4';
            const ext = url.split('?')[0].split('.').pop().toLowerCase();
            if (ext === 'webm') return 'video/webm';
            if (ext === 'mov') return 'video/quicktime';
            return 'video/mp4';
        }

        const appState = {
            publications: [],
            currentPlayingIndex: -1,
            globalMuted: true,
            globalVolume: 0.8
        };

        // ===== Volume général (unique) — le volume natif du lecteur principal
        // est masqué via controlsList="novolume", seul ce curseur commande le son.
        function initGlobalVolume() {
            try {
                const saved = localStorage.getItem('znk_artflow_volume_pref');
                if (saved) {
                    const pref = JSON.parse(saved);
                    appState.globalMuted = !!pref.muted;
                    appState.globalVolume = typeof pref.volume === 'number' ? pref.volume : 0.8;
                }
            } catch (e) { /* ignore */ }

            document.getElementById('globalVolumeSlider').value = Math.round(appState.globalVolume * 100);
            updateGlobalMuteBtn();
        }

        function saveGlobalVolumePref() {
            localStorage.setItem('znk_artflow_volume_pref', JSON.stringify({
                muted: appState.globalMuted,
                volume: appState.globalVolume
            }));
        }

        function updateGlobalMuteBtn() {
            const btn = document.getElementById('globalMuteBtn');
            btn.textContent = appState.globalMuted ? '🔇' : '🔊';
        }

        // Le volume général ne s'applique QU'au lecteur principal.
        // Les vignettes en aperçu restent toujours muettes (sinon toutes les
        // vidéos de la grille joueraient leur son en même temps).
        function applyGlobalVolumeToAllVideos() {
            const mainVideo = document.getElementById('mainVideo');
            if (mainVideo && mainVideo.src) {
                mainVideo.muted = appState.globalMuted;
                mainVideo.volume = appState.globalVolume;
            }
        }

        function toggleGlobalMute() {
            appState.globalMuted = !appState.globalMuted;
            updateGlobalMuteBtn();
            applyGlobalVolumeToAllVideos();
            saveGlobalVolumePref();
        }

        function onGlobalVolumeChange(value) {
            appState.globalVolume = Number(value) / 100;
            if (appState.globalVolume > 0 && appState.globalMuted) {
                appState.globalMuted = false;
                updateGlobalMuteBtn();
            }
            applyGlobalVolumeToAllVideos();
            saveGlobalVolumePref();
        }

        // Charger publications USER
        async function loadData() {
            console.log('🎨 Chargement ArtFlow - Publications User...');
            
            let localPubs = [];
            try {
                const publicationsData = localStorage.getItem('artflow_user_publications');
                if (publicationsData) localPubs = JSON.parse(publicationsData);
            } catch (e) {
                console.error('❌ Erreur publications locales:', e);
            }

            // Publications des AUTRES utilisateurs (si un serveur partagé est
            // configuré) — liste allégée, sans le fichier vidéo (chargé au clic
            // via playPublication, voir plus bas).
            let remotePubs = [];
            if (ZNK_CLOUD_URL) {
                try {
                    const resp = await fetch(znkCloudPath('/api/artflow-posts'));
                    if (resp.ok) {
                        const data = await resp.json();
                        remotePubs = (data.posts || []).map(p => ({ ...p, isRemote: true }));
                    }
                } catch (e) {
                    console.warn('⚠️ Publications distantes injoignables:', e);
                }
            }

            appState.publications = [...localPubs, ...remotePubs];

            if (appState.publications.length > 0) {
                appState.publications.sort((a, b) => {
                    if (a.priority === 'high' && b.priority !== 'high') return -1;
                    if (a.priority !== 'high' && b.priority === 'high') return 1;
                    return new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0);
                });
                console.log(`✅ ${appState.publications.length} publications chargées (${localPubs.length} locales, ${remotePubs.length} distantes)`);
                renderPublications();
            } else {
                console.warn('⚠️ Aucune publication');
                showEmptyState();
            }
        }

        function renderPublications() {
            const container = document.getElementById('popularShows');
            const emptyState = document.getElementById('emptyState');
            const countDisplay = document.getElementById('publicationCount');

            if (appState.publications.length === 0) {
                showEmptyState();
                return;
            }

            emptyState.style.display = 'none';
            countDisplay.textContent = appState.publications.length;
            
            container.innerHTML = appState.publications.map((pub, index) => {
                let thumbnailContent = '';
                let thumbnailClass = 'show-thumbnail type-user-content';
                
                if (pub.videoUrl) {
                    const src = resolveVideoUrl(pub);
                    thumbnailContent = `
                        <video id="video-${index}" muted loop playsinline preload="metadata">
                            <source src="${src}" type="${videoMimeType(src)}">
                        </video>
                        <div class="play-overlay">
                            <div class="play-btn-icon"></div>
                        </div>
                    `;
                } else if (pub.thumbnail) {
                    thumbnailContent = `
                        <img src="${pub.thumbnail}" alt="${pub.title}">
                        <div class="play-overlay">
                            <div class="play-btn-icon"></div>
                        </div>
                    `;
                } else {
                    thumbnailContent = '<div class="play-overlay"><div class="play-btn-icon"></div></div>';
                }
                
                const badge = index === appState.currentPlayingIndex ? 
                    '<div class="now-playing-badge">▶ EN COURS</div>' : '';
                
                return `
                    <div class="show-card ${index === appState.currentPlayingIndex ? 'now-playing' : ''}" 
                         onclick="playPublication(${index})" 
                         id="show-${index}">
                        <div class="${thumbnailClass}">
                            ${thumbnailContent}
                            ${badge}
                            <div class="user-badge">👤 Ma Création</div>
                        </div>
                        <div class="show-title">${pub.title || 'Sans titre'}</div>
                        <div class="show-stats">
                            <span>${pub.views || '0 vues'}</span>
                            <span>${pub.duration || 'N/A'}</span>
                        </div>
                    </div>
                `;
            }).join('');

            setTimeout(() => {
                // ⚠️ Uniquement les vignettes de la grille : #mainVideo est
                // exclu ici. Ce querySelectorAll('video') tournait sur TOUT
                // le document, y compris le lecteur principal — il écrasait
                // donc systématiquement (muted=true, volume=0) le volume que
                // playPublication() venait de régler juste avant, quelques
                // lignes plus haut, en appelant renderPublications(). C'était
                // la cause du son à 0% après sélection d'une vidéo.
                document.querySelectorAll('video:not(#mainVideo)').forEach(video => {
                    video.muted = true;
                    video.volume = 0;
                    video.play().catch(() => {});
                });
            }, 300);
            
            console.log(`✅ ${appState.publications.length} publications affichées`);
        }

        async function playPublication(index) {
            if (index < 0 || index >= appState.publications.length) return;

            appState.currentPlayingIndex = index;
            let pub = appState.publications[index];

            // Publication distante : la liste allégée n'a pas la vidéo — on va
            // chercher le post complet seulement maintenant, au clic.
            if (pub.isRemote && !pub.videoUrl) {
                try {
                    const resp = await fetch(znkCloudPath(`/api/artflow-posts/${pub.id}`));
                    if (resp.ok) {
                        const data = await resp.json();
                        pub = { ...pub, ...data.post };
                        appState.publications[index] = pub;
                    }
                } catch (e) {
                    console.warn('⚠️ Impossible de charger cette publication distante:', e);
                }
            }

            const mainPlayer = document.getElementById('mainPlayer');
            const mainVideo = document.getElementById('mainVideo');
            const mainTitle = document.getElementById('mainPlayerTitle');
            const mainStats = document.getElementById('mainPlayerStats');

            if (pub.videoUrl) {
                mainVideo.src = resolveVideoUrl(pub);

                // Les vignettes de la grille sont volontairement muettes (volume 0),
                // mais au clic pour lancer la lecture, le son doit être audible :
                // si le volume général est encore muet ou à 0 (état initial par
                // défaut), on force un minimum de 50%. Si l'utilisateur a déjà
                // réglé un volume plus haut via la molette, on le respecte.
                if (appState.globalMuted || appState.globalVolume <= 0) {
                    appState.globalMuted = false;
                    appState.globalVolume = Math.max(appState.globalVolume, 0.5);
                    saveGlobalVolumePref();
                    const slider = document.getElementById('globalVolumeSlider');
                    if (slider) slider.value = Math.round(appState.globalVolume * 100);
                    updateGlobalMuteBtn();
                }

                mainVideo.muted = appState.globalMuted;
                mainVideo.volume = appState.globalVolume;
                mainTitle.textContent = pub.title;
                mainStats.textContent = `Publiée le ${new Date(pub.publishedAt).toLocaleDateString()} • ${pub.duration}`;
                
                mainPlayer.style.display = 'block';
                mainPlayer.scrollIntoView({ behavior: 'smooth' });
                mainVideo.play();
            }

            renderPublications();
            showNotification(`▶ ${pub.title}`);
        }

        function closeMainPlayer() {
            const mainPlayer = document.getElementById('mainPlayer');
            const mainVideo = document.getElementById('mainVideo');
            
            mainVideo.pause();
            mainVideo.src = '';
            mainPlayer.style.display = 'none';
            
            appState.currentPlayingIndex = -1;
            renderPublications();
        }

        function showEmptyState() {
            document.getElementById('popularShows').innerHTML = '';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('publicationCount').textContent = '0';
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
                background: #00364a; color: white; padding: 15px 30px;
                border-radius: 25px; z-index: 1000; font-size: 14px;
                backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3);
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Raccourcis clavier
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                loadData();
                showNotification('🔄 Actualisation...');
            }
        });

        // Auto-refresh
        setInterval(() => {
            const currentCount = appState.publications.length;
            loadData();
        }, 30000);

        document.addEventListener('DOMContentLoaded', () => {
            initGlobalVolume();
            loadData();
        });
    </script>
</body>
</html>
