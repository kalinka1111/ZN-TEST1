<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZNKsystem Mail Center - @echo.znk</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: linear-gradient(135deg, #1a1a1a 0%, #fffbe6 100%);
      font-family: 'Zen Kaku Gothic New', Arial, sans-serif; 
      min-height: 100vh;
      padding: 20px;
    }
    
    .container { 
      max-width: 1200px; 
      margin: 20px auto; 
      background: #fffbe6; 
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3); 
      padding: 40px; 
      border: 3px solid #d4af37; 
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 20px;
    }
    
    .title { 
      font-size: 2.3em; 
      font-weight: 700; 
      letter-spacing: 1.2px;
      background: linear-gradient(90deg, #d4af37 40%, #111 60%);
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    
    .subtitle { 
      color: #d4af37; 
      font-size: 1em; 
      letter-spacing: 0.9px;
    }
    
    .toolbar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .btn {
      background: linear-gradient(90deg, #d4af37 60%, #111 100%);
      color: #fffbe6;
      font-family: 'Zen Kaku Gothic New', Arial, sans-serif;
      font-size: 0.95em;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn:hover {
      background: linear-gradient(90deg, #111 40%, #d4af37 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }
    
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    
    .search-box input {
      width: 100%;
      padding: 12px 40px 12px 15px;
      border: 2px solid #d4af37;
      border-radius: 8px;
      font-family: 'Zen Kaku Gothic New', Arial, sans-serif;
      font-size: 0.95em;
      background: #fff;
    }
    
    .email-list {
      background: #fff;
      border-radius: 12px;
      border: 2px solid #d4af37;
      overflow: hidden;
    }
    
    .email-item {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      gap: 15px;
      align-items: start;
    }
    
    .email-item:hover {
      background: #fffdf5;
    }
    
    .email-item.unread {
      background: #fff9e6;
      font-weight: 700;
    }
    
    .email-checkbox {
      margin-top: 5px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .email-content {
      flex: 1;
    }
    
    .email-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .email-from {
      font-weight: 700;
      color: #111;
      font-size: 1.05em;
    }
    
    .email-date {
      color: #666;
      font-size: 0.85em;
    }
    
    .email-subject {
      color: #333;
      margin-bottom: 5px;
      font-size: 1em;
    }
    
    .email-preview {
      color: #666;
      font-size: 0.9em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .email-badges {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 700;
    }
    
    .badge-attachment {
      background: #d4af37;
      color: #fff;
    }
    
    .badge-important {
      background: #ff6b6b;
      color: #fff;
    }
    
    /* Modal Email */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: #fffbe6;
      border-radius: 15px;
      border: 3px solid #d4af37;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    .modal-header {
      padding: 25px;
      border-bottom: 2px solid #d4af37;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: #fffbe6;
      z-index: 10;
    }
    
    .modal-title {
      font-size: 1.5em;
      font-weight: 700;
      color: #111;
    }
    
    .close-btn {
      background: none;
      border: none;
      font-size: 2em;
      color: #d4af37;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }
    
    .close-btn:hover {
      color: #111;
    }
    
    .modal-body {
      padding: 25px;
    }
    
    .email-detail-header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #d4af37;
    }
    
    .email-meta {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
    }
    
    .email-meta-label {
      font-weight: 700;
      color: #d4af37;
      min-width: 80px;
    }
    
    .email-meta-value {
      color: #111;
    }
    
    .email-body-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin: 20px 0;
      line-height: 1.6;
      color: #333;
    }
    
    .attachments-section {
      margin-top: 20px;
    }
    
    .attachments-title {
      font-weight: 700;
      color: #d4af37;
      margin-bottom: 10px;
      font-size: 1.1em;
    }
    
    .attachment-item {
      background: #fff;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .attachment-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .attachment-icon {
      width: 24px;
      height: 24px;
      background: #d4af37;
      border-radius: 4px;
    }
    
    .modal-footer {
      padding: 20px 25px;
      border-top: 2px solid #d4af37;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      background: #fffbe6;
      position: sticky;
      bottom: 0;
    }
    
    /* Compose Modal */
    .compose-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .form-label {
      font-weight: 700;
      color: #d4af37;
    }
    
    .form-input, .form-textarea {
      padding: 12px;
      border: 2px solid #d4af37;
      border-radius: 8px;
      font-family: 'Zen Kaku Gothic New', Arial, sans-serif;
      font-size: 1em;
      background: #fff;
    }
    
    .form-textarea {
      min-height: 200px;
      resize: vertical;
    }
    
    .attachment-zone {
      border: 2px dashed #d4af37;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .attachment-zone:hover, .attachment-zone.dragover {
      background: #fffdf5;
      border-color: #111;
    }
    
    .file-input-hidden {
      display: none;
    }
    
    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      border: 2px solid #d4af37;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #333;
    }
    
    .stat-icon {
      color: #d4af37;
      font-weight: 700;
    }
    
    .copyright-footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px solid #d4af37;
      color: #666;
      font-size: 0.9em;
    }
    
    .copyright-badge {
      display: inline-block;
      background: linear-gradient(90deg, #d4af37, #111);
      color: #fffbe6;
      padding: 5px 15px;
      border-radius: 15px;
      font-weight: 700;
      margin-top: 5px;
    }

    @media (max-width: 768px) {
      .container { padding: 20px; }
      .toolbar { flex-direction: column; }
      .email-header { flex-direction: column; align-items: flex-start; gap: 5px; }
      .modal-content { margin: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Messagerie @echo.znk</div>
      <div class="subtitle">Système ZNKsystem • Or & Noir • Validé AIIA</div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-icon">📧</span>
        <span>Total: <strong id="totalCount">0</strong></span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">📬</span>
        <span>Non lus: <strong id="unreadCount">0</strong></span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">📎</span>
        <span>Avec pièces jointes: <strong id="attachmentCount">0</strong></span>
      </div>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button class="btn" onclick="openComposeModal()">
          ✉️ Nouveau message
        </button>
        <button class="btn" onclick="refreshInbox()">
          🔄 Actualiser
        </button>
        <button class="btn" onclick="deleteSelected()">
          🗑️ Supprimer
        </button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Rechercher dans les emails..." oninput="searchEmails()">
      </div>
    </div>

    <div class="email-list" id="emailList">
      <!-- Les emails seront chargés ici -->
    </div>

    <div class="copyright-footer">
      <div>© 2025 ZNKsystem - Tous droits réservés</div>
      <div class="copyright-badge">Validé AIIA • @echo.znk</div>
    </div>
  </div>

  <!-- Modal Lecture Email -->
  <div class="modal" id="readModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">📧 Lecture du message</div>
        <button class="close-btn" onclick="closeReadModal()">&times;</button>
      </div>
      <div class="modal-body" id="emailDetailContent">
        <!-- Contenu chargé dynamiquement -->
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="replyEmail()">↩️ Répondre</button>
        <button class="btn" onclick="downloadEmailPDF()">📥 Télécharger PDF</button>
        <button class="btn" onclick="closeReadModal()">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Modal Composition -->
  <div class="modal" id="composeModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">✍️ Nouveau message</div>
        <button class="close-btn" onclick="closeComposeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form class="compose-form" id="composeForm" onsubmit="sendEmail(event)">
          <div class="form-group">
            <label class="form-label">À :</label>
            <input type="email" class="form-input" id="toInput" placeholder="destinataire@echo.znk" required>
          </div>
          <div class="form-group">
            <label class="form-label">Sujet :</label>
            <input type="text" class="form-input" id="subjectInput" placeholder="Sujet du message" required>
          </div>
          <div class="form-group">
            <label class="form-label">Message :</label>
            <textarea class="form-textarea" id="bodyInput" placeholder="Votre message..." required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Pièces jointes :</label>
            <div class="attachment-zone" id="attachmentZone" onclick="document.getElementById('fileInput').click()">
              <div>📎 Cliquez ou glissez-déposez des fichiers ici</div>
              <div id="attachmentList" style="margin-top: 10px; text-align: left;"></div>
            </div>
            <input type="file" id="fileInput" class="file-input-hidden" multiple onchange="handleFiles(this.files)">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="sendEmail(event)">📤 Envoyer</button>
        <button class="btn" onclick="closeComposeModal()">Annuler</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <script>
    // Connexion au backend local ZNK (Flask + nœud P2P, voir server.py)
    const ZNK_BACKEND_URL = 'http://localhost:5000';
    const ZNK_ACCOUNT_KEY = 'znk_account';
    const ZNK_SESSION_KEY = 'znk_userData';
    const READ_IDS_KEY = 'znk_email_read_ids';

    function znkLoadIdentity() {
      const session = sessionStorage.getItem(ZNK_SESSION_KEY);
      if (session) {
        try { return JSON.parse(session); } catch (e) { /* ignore */ }
      }
      const account = localStorage.getItem(ZNK_ACCOUNT_KEY);
      if (account) {
        try { return JSON.parse(account); } catch (e) { /* ignore */ }
      }
      return null;
    }

    function getReadIds() {
      try { return new Set(JSON.parse(localStorage.getItem(READ_IDS_KEY) || '[]')); }
      catch (e) { return new Set(); }
    }

    function markAsRead(id) {
      const ids = getReadIds();
      ids.add(id);
      localStorage.setItem(READ_IDS_KEY, JSON.stringify([...ids]));
    }

    let emails = [];
    let currentEmail = null;
    let attachedFiles = [];
    let currentUserIdZNK = null;

    // Initialisation
    async function init() {
      const identity = znkLoadIdentity();
      currentUserIdZNK = identity ? (identity.idZNK || identity.id) : null;

      if (!currentUserIdZNK) {
        document.getElementById('emailList').innerHTML =
          '<div style="padding: 40px; text-align: center; color: #666;">Connectez-vous via auth-hub.html pour accéder à votre messagerie.</div>';
        return;
      }

      await registerIdentity();
      await loadInboxFromBackend();
      setupDragDrop();

      // Rafraîchissement automatique (nouveaux messages reçus en P2P)
      setInterval(loadInboxFromBackend, 15000);
    }

    async function registerIdentity() {
      try {
        await fetch(`${ZNK_BACKEND_URL}/api/identity/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idZNK: currentUserIdZNK })
        });
      } catch (e) {
        console.warn('⚠️ Backend ZNK injoignable (localhost:5000) - démarrez server.py', e);
      }
    }

    async function loadInboxFromBackend() {
      try {
        const response = await fetch(`${ZNK_BACKEND_URL}/api/messages/inbox`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const readIds = getReadIds();

        emails = (data.messages || []).map(m => ({
          id: m.id,
          from: m.from,
          to: m.to,
          subject: m.sujet || '(sans sujet)',
          body: m.corps || '',
          date: new Date((m.timestamp || 0) * 1000),
          read: readIds.has(m.id),
          attachments: []
        }));

        renderEmails();
        updateStats();
      } catch (e) {
        console.warn('⚠️ Impossible de charger la boîte de réception:', e);
      }
    }

    // Rendu de la liste d'emails
    function renderEmails(filteredEmails = null) {
      const emailList = document.getElementById('emailList');
      const emailsToRender = filteredEmails || emails;
      
      if (emailsToRender.length === 0) {
        emailList.innerHTML = '<div style="padding: 40px; text-align: center; color: #666;">Aucun email trouvé</div>';
        return;
      }

      emailList.innerHTML = emailsToRender.map(email => `
        <div class="email-item ${!email.read ? 'unread' : ''}" onclick="openEmail(${email.id})">
          <input type="checkbox" class="email-checkbox" onclick="event.stopPropagation()" data-id="${email.id}">
          <div class="email-content">
            <div class="email-header">
              <span class="email-from">${email.from}</span>
              <span class="email-date">${formatDate(email.date)}</span>
            </div>
            <div class="email-subject">${email.subject}</div>
            <div class="email-preview">${email.body.substring(0, 100)}...</div>
            <div class="email-badges">
              ${email.attachments.length > 0 ? `<span class="badge badge-attachment">📎 ${email.attachments.length} pièce(s) jointe(s)</span>` : ''}
              ${!email.read ? '<span class="badge badge-important">Nouveau</span>' : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    // Ouvrir un email
    function openEmail(id) {
      currentEmail = emails.find(e => e.id === id);
      if (!currentEmail) return;

      currentEmail.read = true;
      markAsRead(currentEmail.id);
      renderEmails();
      updateStats();

      const content = `
        <div class="email-detail-header">
          <div class="email-meta">
            <span class="email-meta-label">De :</span>
            <span class="email-meta-value">${currentEmail.from}</span>
          </div>
          <div class="email-meta">
            <span class="email-meta-label">À :</span>
            <span class="email-meta-value">${currentEmail.to}</span>
          </div>
          <div class="email-meta">
            <span class="email-meta-label">Date :</span>
            <span class="email-meta-value">${formatDateLong(currentEmail.date)}</span>
          </div>
          <div class="email-meta">
            <span class="email-meta-label">Sujet :</span>
            <span class="email-meta-value"><strong>${currentEmail.subject}</strong></span>
          </div>
        </div>
        
        <div class="email-body-content">
          ${currentEmail.body.replace(/\n/g, '<br>')}
        </div>

        ${currentEmail.attachments.length > 0 ? `
          <div class="attachments-section">
            <div class="attachments-title">📎 Pièces jointes (${currentEmail.attachments.length})</div>
            ${currentEmail.attachments.map(att => `
              <div class="attachment-item">
                <div class="attachment-info">
                  <div class="attachment-icon"></div>
                  <div>
                    <div><strong>${att.name}</strong></div>
                    <div style="font-size: 0.85em; color: #666;">${att.size}</div>
                  </div>
                </div>
                <button class="btn" onclick="downloadAttachment('${att.name}')">📥 Télécharger</button>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `;

      document.getElementById('emailDetailContent').innerHTML = content;
      document.getElementById('readModal').classList.add('active');
    }

    // Télécharger en PDF
    function downloadEmailPDF() {
      if (!currentEmail) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Configurer le PDF
      doc.setFont("helvetica");
      
      // Header avec copyright
      doc.setFillColor(212, 175, 55);
      doc.rect(0, 0, 210, 30, 'F');
      doc.setTextColor(255, 251, 230);
      doc.setFontSize(20);
      doc.text("ZNKsystem @echo.znk", 105, 15, { align: 'center' });
      doc.setFontSize(10);
      doc.text("© ZNK - Validé AIIA", 105, 22, { align: 'center' });

      // Contenu de l'email
      doc.setTextColor(0, 0, 0);
      let y = 45;

      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.text(`De: ${currentEmail.from}`, 20, y);
      y += 8;
      doc.text(`À: ${currentEmail.to}`, 20, y);
      y += 8;
      doc.text(`Date: ${formatDateLong(currentEmail.date)}`, 20, y);
      y += 8;
      doc.text(`Sujet: ${currentEmail.subject}`, 20, y);
      y += 15;

      // Corps du message
      doc.setFont("helvetica", "normal");
      doc.setFontSize(11);
      const lines = doc.splitTextToSize(currentEmail.body, 170);
      doc.text(lines, 20, y);
      y += lines.length * 6 + 10;

      // Pièces jointes
      if (currentEmail.attachments.length > 0) {
        doc.setFont("helvetica", "bold");
        doc.text(`Pièces jointes (${currentEmail.attachments.length}):`, 20, y);
        y += 8;
        doc.setFont("helvetica", "normal");
        currentEmail.attachments.forEach(att => {
          doc.text(`• ${att.name} (${att.size})`, 25, y);
          y += 6;
        });
      }

      // Footer avec copyright
      const pageHeight = doc.internal.pageSize.height;
      doc.setFillColor(212, 175, 55);
      doc.rect(0, pageHeight - 20, 210, 20, 'F');
      doc.setTextColor(255, 251, 230);
      doc.setFontSize(9);
      doc.text("© 2025 ZNKsystem - Tous droits réservés • Validé AIIA • @echo.znk", 105, pageHeight - 10, { align: 'center' });

      // Télécharger
      doc.save(`ZNK_Email_${currentEmail.id}_${Date.now()}.pdf`);
    }

    // Modal composition
    function openComposeModal() {
      document.getElementById('composeModal').classList.add('active');
      attachedFiles = [];
      updateAttachmentDisplay();
    }

    function closeComposeModal() {
      document.getElementById('composeModal').classList.remove('active');
      document.getElementById('composeForm').reset();
      attachedFiles = [];
    }

    function closeReadModal() {
      document.getElementById('readModal').classList.remove('active');
      currentEmail = null;
    }

    // Gestion des fichiers
    function setupDragDrop() {
      const zone = document.getElementById('attachmentZone');
      
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('dragover');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('dragover');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
      });
    }

    function handleFiles(files) {
      for (let file of files) {
        attachedFiles.push({
          name: file.name,
          size: formatFileSize(file.size),
          type: file.type,
          file: file
        });
      }
      updateAttachmentDisplay();
    }

    function updateAttachmentDisplay() {
      const list = document.getElementById('attachmentList');
      if (attachedFiles.length === 0) {
        list.innerHTML = '';
        return;
      }

      list.innerHTML = attachedFiles.map((file, idx) => `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #fffdf5; border-radius: 5px; margin-top: 5px;">
          <span>📎 ${file.name} (${file.size})</span>
          <button type="button" onclick="removeAttachment(${idx})" style="background: #ff6b6b; color: white; border: none; border-radius: 5px; padding: 3px 10px; cursor: pointer;">✕</button>
        </div>
      `).join('');
    }

    function removeAttachment(idx) {
      attachedFiles.splice(idx, 1);
      updateAttachmentDisplay();
    }

    // Envoyer un email
    async function sendEmail(event) {
      if (event) event.preventDefault();

      const to = document.getElementById('toInput').value.trim();
      const subject = document.getElementById('subjectInput').value;
      const body = document.getElementById('bodyInput').value;

      if (!to) {
        alert("⚠️ Merci d'indiquer l'idZNK du destinataire (ex: ZNK-2026-7891).");
        return;
      }

      try {
        const response = await fetch(`${ZNK_BACKEND_URL}/api/messages/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to, subject, body, canal: 'email' })
        });

        const result = await response.json();

        if (result.delivered) {
          alert('✅ Message envoyé et livré directement à ' + to + ' !');
        } else {
          alert('📋 ' + to + ' n\'est pas joignable sur le réseau local en ce moment.\nLe message est en attente et sera livré automatiquement dès sa reconnexion.');
        }

        closeComposeModal();
      } catch (e) {
        alert("❌ Backend ZNK injoignable (localhost:5000). Vérifiez que server.py est lancé.");
        console.error(e);
      }
    }

    // Répondre à un email
    function replyEmail() {
      if (!currentEmail) return;
      
      closeReadModal();
      openComposeModal();
      
      document.getElementById('toInput').value = currentEmail.from;
      document.getElementById('subjectInput').value = 'Re: ' + currentEmail.subject;
      document.getElementById('bodyInput').value = '\n\n------- Message original -------\n' + 
        'De: ' + currentEmail.from + '\n' +
        'Date: ' + formatDateLong(currentEmail.date) + '\n\n' +
        currentEmail.body;
    }

    // Recherche
    function searchEmails() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      if (!query) {
        renderEmails();
        return;
      }

      const filtered = emails.filter(email => 
        email.from.toLowerCase().includes(query) ||
        email.subject.toLowerCase().includes(query) ||
        email.body.toLowerCase().includes(query)
      );

      renderEmails(filtered);
    }

    // Supprimer les emails sélectionnés
    function deleteSelected() {
      const checkboxes = document.querySelectorAll('.email-checkbox:checked');
      const idsToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.id));
      
      if (idsToDelete.length === 0) {
        alert('⚠️ Veuillez sélectionner au moins un email à supprimer');
        return;
      }

      if (confirm(`Voulez-vous vraiment supprimer ${idsToDelete.length} email(s) ?`)) {
        emails = emails.filter(email => !idsToDelete.includes(email.id));
        renderEmails();
        updateStats();
        alert('✅ Email(s) supprimé(s) avec succès');
      }
    }

    // Actualiser
    async function refreshInbox() {
      await loadInboxFromBackend();
      
      // Animation de confirmation
      const btn = event.target;
      btn.textContent = '✓ Actualisé';
      setTimeout(() => {
        btn.innerHTML = '🔄 Actualiser';
      }, 1500);
    }

    // Télécharger une pièce jointe
    function downloadAttachment(filename) {
      alert('📥 Téléchargement de: ' + filename + '\n\n(Simulation - en production, le fichier serait téléchargé)');
    }

    // Mise à jour des statistiques
    function updateStats() {
      document.getElementById('totalCount').textContent = emails.length;
      document.getElementById('unreadCount').textContent = emails.filter(e => !e.read).length;
      document.getElementById('attachmentCount').textContent = emails.filter(e => e.attachments.length > 0).length;
    }

    // Formatage des dates
    function formatDate(date) {
      const now = new Date();
      const diff = now - date;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      
      if (hours < 1) return 'À l\'instant';
      if (hours < 24) return `Il y a ${hours}h`;
      if (hours < 48) return 'Hier';
      
      return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
    }

    function formatDateLong(date) {
      return date.toLocaleDateString('fr-FR', { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // Démarrer l'application
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
