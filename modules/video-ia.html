<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZNK--videos-generator</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
        }
        .container {
            max-width: 900px; margin: 40px auto; padding: 32px;
            border-radius: 16px; background: #101820;
            box-shadow: 0 0 32px #00d4ff77, 0 0 0 5px #00d4ff33;
            border: 2px solid #00d4ff;
            position: relative;
        }
        h1 {
            font-size: 2.3rem; color: #00d4ff; text-align: center;
            margin-bottom: 20px; text-shadow: 0 0 14px #00d4ff77;
        }
        .form-row { display: flex; gap: 24px; margin-bottom: 20px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        label { color: #00d4ff; font-weight: 600; margin-bottom: 6px; }
        select, input, textarea {
            padding: 8px 10px; border-radius: 6px; border: 1.5px solid #00d4ff99;
            background: #111; color: #fff; font-size: 1rem;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #00ff88; }
        textarea { min-height: 60px; }
        .actions { display: flex; gap: 20px; margin-top: 14px; justify-content: center;}
        button {
            padding: 10px 28px; border-radius: 12px; border: 2px solid #00d4ff;
            background: #00d4ff1a; color: #00d4ff; font-weight: 700; font-size: 1.08rem;
            cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        button:hover { background: #00d4ff33; color: #00ff88; border-color: #00ff88; }
        .output-zone {
            margin-top: 30px; padding: 20px; border-radius: 13px;
            background: #111; border: 2px solid #00d4ff88;
            box-shadow: 0 0 9px #00d4ff44;
        }
        .output-title { color: #00ff88; font-weight: 700; font-size: 1.2rem; margin-bottom: 7px;}
        .output-field { margin-bottom: 11px;}
        .output-label { font-weight: 600; color: #00d4ff;}
        video { width: 100%; margin-top: 13px; border-radius: 9px; background: #000; }
        .community-zone { margin-top: 38px; background: #001b30; border-radius: 12px; padding: 17px; border: 1.5px solid #00d4ff55;}
        .community-title { color: #00d4ff; font-weight: 700;}
        .community-list { margin-top: 11px;}
        .community-video { margin-bottom: 12px;}
        .video-link { color: #00ff88; text-decoration: underline; cursor: pointer;}
        @media (max-width: 700px) {
            .form-row { flex-direction: column; gap: 0;}
            .container { padding: 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>ZNK--videos-generator</h1>
    <form id="videoForm" autocomplete="off">
        <div class="form-row">
            <div class="form-group">
                <label for="videoType">Type de vidéo</label>
                <select id="videoType" required>
                    <option value="">Choisir...</option>
                    <option>Clip IA (prompt)</option>
                    <option>Montage</option>
                    <option>Vidéo à partir d'image</option>
                    <option>VTube Avatar</option>
                    <option>Studio direct (écran vert)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="duration">Durée (sec)</label>
                <input type="number" id="duration" min="5" max="900" value="30" required>
            </div>
        </div>
        <div class="form-group">
            <label for="prompt">Prompt / Scénario / Idées</label>
            <textarea id="prompt" placeholder="Décrivez ce que vous voulez générer, ex: 'Une scène urbaine futuriste au coucher du soleil, style anime'"></textarea>
        </div>
        <div class="form-group">
            <label for="options">Options supplémentaires</label>
            <input type="text" id="options" placeholder="Transitions, musique, voix-off, avatar, etc.">
        </div>
        <div class="actions">
            <button type="submit">Générer la vidéo</button>
            <button type="button" onclick="resetForm()">Reset</button>
        </div>
    </form>
    <div class="output-zone" id="outputZone" style="display:none;">
        <div class="output-title">Vidéo générée :</div>
        <div class="output-field"><span class="output-label">Type :</span> <span id="outType"></span></div>
        <div class="output-field"><span class="output-label">Durée :</span> <span id="outDuration"></span> sec</div>
        <div class="output-field"><span class="output-label">Prompt :</span> <span id="outPrompt"></span></div>
        <div class="output-field"><span class="output-label">Options :</span> <span id="outOptions"></span></div>
        <video controls id="videoPlayer" style="display:none;">
            <source id="videoSource" src="" type="video/mp4">
            Votre navigateur ne supporte pas la vidéo.
        </video>
    </div>
    <div class="community-zone" id="communityZone">
        <div class="community-title">🎬 Vidéos de la communauté ZNK</div>
        <div class="community-list" id="communityList">
            <!-- Ajoutez dynamiquement ici -->
        </div>
    </div>
</div>
<script>
    // Simuler une base de vidéos communautaires
    let znkVideos = [
        {title:"Prompt IA Animé", author:"ZNK VideoArtist", url:"https://znksystem.com/videos/prompt-anime-demo.mp4"},
        {title:"Montage VTube", author:"User ZNK", url:"https://znksystem.com/videos/vtube-montage-demo.mp4"}
    ];
    function renderCommunityVideos() {
        const list = document.getElementById('communityList');
        list.innerHTML = "";
        znkVideos.forEach(video => {
            list.innerHTML += `<div class="community-video"><b>${video.title}</b> <i>(${video.author})</i> — <span class="video-link" onclick="playCommunityVideo('${video.url}')">Visionner</span></div>`;
        });
    }
    function playCommunityVideo(url) {
        document.getElementById('videoPlayer').style.display = "block";
        document.getElementById('videoSource').src = url;
        document.getElementById('videoPlayer').load();
        document.getElementById('videoPlayer').play();
    }
    // Génération vidéo (à connecter à une API gratuite IA vidéo)
    document.getElementById('videoForm').addEventListener('submit', function(e){
        e.preventDefault();
        const type = document.getElementById('videoType').value;
        const duration = document.getElementById('duration').value;
        const prompt = document.getElementById('prompt').value || "-";
        const options = document.getElementById('options').value || "-";
        // Affichage
        document.getElementById('outType').textContent = type;
        document.getElementById('outDuration').textContent = duration;
        document.getElementById('outPrompt').innerHTML = prompt.replace(/\n/g, '<br>');
        document.getElementById('outOptions').textContent = options;
        document.getElementById('outputZone').style.display = "block";
        // Simulation : API IA vidéo
        // À remplacer par appel réel à Hailuo IA, HuggingFace, etc.
        let videoUrl = "https://znksystem.com/simulate-video?type="+encodeURIComponent(type)+"&prompt="+encodeURIComponent(prompt)+"&duration="+duration;
        document.getElementById('videoSource').src = videoUrl;
        document.getElementById('videoPlayer').style.display = "block";
        document.getElementById('videoPlayer').load();
    });
    function resetForm() {
        document.getElementById('videoForm').reset();
        document.getElementById('outputZone').style.display = "none";
        document.getElementById('videoPlayer').style.display = "none";
    }
    // Initialisation
    document.addEventListener('DOMContentLoaded', () => {
        renderCommunityVideos();
    });
</script>
</body>
</html>
