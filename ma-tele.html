<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Télé - ArtFlow</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        .main-container {
            width: 100vw;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* En-tête compact */
        .central-screen {
            width: 90%;
            max-width: 1200px;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .connection-status,
        .playlist-indicator {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Zone principale */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 10px 0 80px 0;
        }

        /* Grille des émissions */
        .popular-shows {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        .show-card {
            /* Fond pastel = le cadre complet de l'émission (voir maquette) */
            background: var(--cat-color, rgba(255, 255, 255, 0.05));
            border-radius: 15px;
            padding: 20px;
            transition: all 0.4s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .show-card:hover {
            transform: translateY(-10px) scale(1.02);
            filter: brightness(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .show-card.now-playing {
            border: 3px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .show-thumbnail {
            width: 100%;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            background: #000;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .show-thumbnail video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Contient toute la vidéo */
            border-radius: 10px;
        }

        .show-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        /* Gradients par type */
        .show-thumbnail.type-emission-znk-artistes {
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
        }

        .show-thumbnail.type-emission-znk-actu {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
        }

        .show-thumbnail.type-serie-znk-les-reveurs {
            background: linear-gradient(45deg, #43e97b 0%, #38f9d7 100%);
        }

        .show-thumbnail.type-studios-effets {
            background: linear-gradient(45deg, #fa709a 0%, #fee140 100%);
        }

        .show-thumbnail.type-general {
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .show-card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #333;
        }

        .play-btn-icon::before {
            content: '▶';
            margin-left: 3px;
        }

        .now-playing-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #00ff88;
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            z-index: 10;
        }

        .show-title {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0 8px 0;
        }

        .show-stats {
            font-size: 14px;
            color: #cccccc;
            display: flex;
            justify-content: space-between;
        }

        /* Bouton unmute visible */
        .sound-control {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border: 2px solid #00ff88;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            z-index: 20;
            transition: all 0.3s;
        }

        .sound-control:hover {
            background: #00ff88;
            color: #000;
            transform: scale(1.1);
        }

        .sound-control.muted::before {
            content: '🔇 ';
        }

        .sound-control.unmuted::before {
            content: '🔊 ';
        }

        /* Contrôle de volume général (unique, remplace le bouton par vidéo) */
        .global-volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .global-volume-control button {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }

        .global-volume-control input[type="range"] {
            width: 90px;
            accent-color: #00ff88;
            cursor: pointer;
        }

        /* Badge ACTV affiché sur chaque vidéo en lecture */
        .video-badge-actv {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.55);
            color: #00ff88;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 136, 0.4);
            z-index: 15;
            pointer-events: none;
        }

        .video-badge-actv.large {
            font-size: 14px;
            padding: 5px 12px;
            top: 14px;
            right: 14px;
        }

        /* Badge nombre d'épisodes sur une carte d'émission */
        .episodes-count-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Bandeau d'épisodes sous le lecteur principal */
        .episodes-strip {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 15px 20px 20px;
            background: rgba(0, 0, 0, 0.85);
        }

        .episode-chip {
            flex: 0 0 140px;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            background: #111;
        }

        .episode-chip.active {
            border-color: #00ff88;
        }

        .episode-chip .ep-thumb {
            width: 100%;
            padding-bottom: 56.25%;
            position: relative;
            background: #000;
        }

        .episode-chip .ep-thumb img,
        .episode-chip .ep-thumb video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episode-chip .ep-title {
            font-size: 11px;
            padding: 6px 8px;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .nav-ep-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }

        .nav-ep-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-ep-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Logo ACTV */
        /* Grand titre ACTV affiché en haut de la page */
        .actv-hero-title {
            text-align: center;
            margin: 25px auto 5px;
            animation: heroGlow 3s ease-in-out infinite alternate;
        }

        .actv-hero-title img {
            max-height: 110px;
            max-width: 90%;
            height: auto;
            width: auto;
        }

        @keyframes heroGlow {
            from { filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.3)); }
            to { filter: drop-shadow(0 0 25px rgba(79, 172, 254, 0.5)); }
        }

        .actv-logo {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 200;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Loading */
        .loading-indicator {
            text-align: center;
            padding: 40px;
            color: #00ff88;
            font-size: 14px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .show-card {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .show-card:nth-child(1) { animation-delay: 0.1s; }
        .show-card:nth-child(2) { animation-delay: 0.2s; }
        .show-card:nth-child(3) { animation-delay: 0.3s; }
        .show-card:nth-child(4) { animation-delay: 0.4s; }
        .show-card:nth-child(5) { animation-delay: 0.5s; }
        .show-card:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="content-area">
            <div class="actv-hero-title" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                <div style="display:flex; align-items:center; justify-content:center; gap:14px;">
                    <img src="./icons/ma-tele.svg" alt="Ma Télé" style="max-height:60px; width:auto; height:auto;" onerror="this.onerror=null; this.src='./icons/ma-tele.svg';">
                    <span style="font-size: 32px; font-weight: 800; letter-spacing: 3px; color: #ffffff;">MA TÉLÉ</span>
                </div>
                <div id="maTeleUserName" style="font-size: 24px; font-weight: 700; color: #00ff88; margin-top: 10px; letter-spacing: 2px;"></div>
            </div>
                <!-- En-tête -->
            <div class="central-screen">
                <div class="global-volume-control">
                    <button id="globalMuteBtn" onclick="toggleGlobalMute()">🔇</button>
                    <input type="range" id="globalVolumeSlider" min="0" max="100" value="80" oninput="onGlobalVolumeChange(this.value)">
                </div>
                <div class="playlist-indicator" id="playlistIndicator">
                    <span>📼 <span id="totalCount">0</span>/<span id="totalMaxDisplay">15</span> vidéos • 🎬 <span id="emissionCount">0</span> émissions</span>
                </div>
            </div>

            <!-- Lecteur principal -->
            <div id="mainPlayer" style="display: none; width: 90%; max-width: 1200px; margin: 20px auto; background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
                <div style="padding: 18px 20px 8px; background: rgba(0,0,0,0.85);">
                    <h2 id="mainPlayerTitle" style="margin-bottom: 6px;"></h2>
                    <div id="mainPlayerStats" style="color: #999; font-size: 14px;"></div>
                </div>
                <div id="mainVideoFrame" style="position: relative; padding-bottom: 56.25%; background: #000;">
                    <video id="mainVideo" controls style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;"></video>
                    <div class="video-badge-actv large">ARTFLOW</div>
                </div>
                <div style="padding: 20px; background: rgba(0,0,0,0.8);">
                    <div class="player-controls-row">
                        <button class="nav-ep-btn" id="prevEpBtn" onclick="prevEpisode()">⏮ Précédent</button>
                        <button id="autoplayToggleBtn" class="nav-ep-btn" onclick="toggleAutoplay()">▶️ Lecture continue : ON</button>
                        <button class="nav-ep-btn" id="nextEpBtn" onclick="nextEpisode()">Suivant ⏭</button>
                    </div>
                    <button onclick="closeMainPlayer()" style="margin-top: 15px; padding: 10px 20px; background: #ef4444; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: 600;">
                        ✕ Fermer
                    </button>
                </div>
                <div class="episodes-strip" id="episodesStrip"></div>
            </div>

            <!-- Grille émissions -->
            <div class="popular-shows" id="popularShows">
                <div class="loading-indicator">📡 Chargement des émissions...</div>
            </div>

            <!-- Empty state -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📺</div>
                <div style="font-size: 24px; margin-bottom: 12px; color: #999;">Aucune émission disponible</div>
                <div style="font-size: 14px; color: #666;">
                    Créez vos émissions depuis actvAdminPublish.html
                </div>
            </div>
        </div>

        <div class="actv-logo">ACTV</div>
    </div>

    <script>
        // Navigation dans iframe (éviter loop)
        function navigateInDashboard(url) {
            if (window.parent && window.parent !== window && window.parent.location.href !== window.location.href) {
                window.parent.postMessage({ type: 'navigate', url: url }, '*');
            } else {
                window.location.href = url;
            }
        }

        // Libellés des catégories (doivent correspondre aux valeurs de znk-publish-studio.html)
        const categoryLabels = {
            'emission-znk-artistes': 'Emission ZNK Artistes',
            'emission-znk-actu': 'Emission ZNK Actualité',
            'serie-znk-les-reveurs': 'Série ZNK Les Rêveurs',
            'studios-effets': 'Studios Effets',
            'general': 'Général'
        };

        // Identité utilisateur (Ma Télé n'affiche que les publications de CE user, comme sur ArtFlow Studio)
        function getUserId() {
            let id = localStorage.getItem('znk_user_id');
            if (!id) {
                id = `user_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                localStorage.setItem('znk_user_id', id);
            }
            return id;
        }

        function getUserName() {
            return localStorage.getItem('znk_user_name') || 'Utilisateur ArtFlow';
        }

        // Limite unifiée app-wide (posts, vidéos, musiques...) : 200, un chiffre
        // volontairement généreux — le vrai coût est le fichier média persisté
        // sur disque (quasi illimité), pas ces quelques octets de métadonnées.
        const TOTAL_LIMIT = 200;

        function getCategoryLabel(type) {
            return categoryLabels[type] || (type ? type.charAt(0).toUpperCase() + type.slice(1) : 'Général');
        }

        // Couleur de cadre propre à chaque émission/catégorie (tons pastel)
        const categoryColors = {
            'emission-znk-artistes': '#ffb3c6',
            'emission-znk-actu': '#a9d8ff',
            'serie-znk-les-reveurs': '#b8f2d1',
            'studios-effets': '#ffd9a8',
            'general': '#d4c4fb'
        };

        function getCategoryColor(type) {
            if (categoryColors[type]) return categoryColors[type];
            // Repli : couleur pastel générée automatiquement pour toute nouvelle catégorie
            let hash = 0;
            for (let i = 0; i < type.length; i++) {
                hash = type.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 70%, 82%)`;
        }

        // État de l'application
        const appState = {
            emissions: [],   // liste brute des vidéos publiées
            shows: [],       // émissions groupées par catégorie, chacune avec sa liste de vidéos (épisodes)
            currentShowIndex: -1,
            currentEpisodeIndex: -1,
            currentPlayingIndex: -1, // conservé pour compatibilité
            globalMuted: true,
            globalVolume: 0.8,
            autoplayNext: true
        };

        // Regroupe les émissions plates par catégorie (type) pour former des "shows" à épisodes compilés
        function groupEmissionsByType() {
            const groups = new Map();
            appState.emissions.forEach(emission => {
                const type = emission.type || 'general';
                if (!groups.has(type)) {
                    groups.set(type, {
                        type: type,
                        label: getCategoryLabel(type),
                        videos: []
                    });
                }
                groups.get(type).videos.push(emission);
            });

            // Trier les épisodes de chaque show (priorité puis date)
            groups.forEach(show => {
                show.videos.sort((a, b) => {
                    if (a.priority === 'high' && b.priority !== 'high') return -1;
                    if (a.priority !== 'high' && b.priority === 'high') return 1;
                    return new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0);
                });
            });

            appState.shows = Array.from(groups.values());
        }

        // ===== Volume général (unique, ne s'affiche plus par vidéo) =====
        function initGlobalVolume() {
            try {
                const saved = localStorage.getItem('znk_actv_volume_pref');
                if (saved) {
                    const pref = JSON.parse(saved);
                    appState.globalMuted = !!pref.muted;
                    appState.globalVolume = typeof pref.volume === 'number' ? pref.volume : 0.8;
                }
            } catch (e) { /* ignore */ }

            document.getElementById('globalVolumeSlider').value = Math.round(appState.globalVolume * 100);
            updateGlobalMuteBtn();
        }

        function saveGlobalVolumePref() {
            localStorage.setItem('znk_actv_volume_pref', JSON.stringify({
                muted: appState.globalMuted,
                volume: appState.globalVolume
            }));
        }

        function updateGlobalMuteBtn() {
            const btn = document.getElementById('globalMuteBtn');
            btn.textContent = appState.globalMuted ? '🔇' : '🔊';
        }

        // Le volume général ne s'applique QU'au lecteur principal.
        // Les vignettes en aperçu restent toujours muettes (sinon toutes les vidéos
        // de la grille joueraient leur son en même temps).
        function applyGlobalVolumeToAllVideos() {
            const mainVideo = document.getElementById('mainVideo');
            if (mainVideo && mainVideo.src) {
                mainVideo.muted = appState.globalMuted;
                mainVideo.volume = appState.globalVolume;
            }
        }

        function toggleGlobalMute() {
            appState.globalMuted = !appState.globalMuted;
            updateGlobalMuteBtn();
            applyGlobalVolumeToAllVideos();
            saveGlobalVolumePref();
        }

        function onGlobalVolumeChange(value) {
            appState.globalVolume = Number(value) / 100;
            if (appState.globalVolume > 0 && appState.globalMuted) {
                appState.globalMuted = false;
                updateGlobalMuteBtn();
            }
            applyGlobalVolumeToAllVideos();
            saveGlobalVolumePref();
        }

        function toggleAutoplay() {
            appState.autoplayNext = !appState.autoplayNext;
            document.getElementById('autoplayToggleBtn').textContent =
                appState.autoplayNext ? '▶️ Lecture continue : ON' : '⏸ Lecture continue : OFF';
        }

        // Charger les publications ArtFlow de l'utilisateur courant
   async function loadData() {
    console.log('📺 Chargement de Ma Télé...');

    document.getElementById('maTeleUserName').textContent = `— ${getUserName()}`;

    try {
        const raw = localStorage.getItem('artflow_user_publications');
        const userId = getUserId();
        const myPubs = (raw ? JSON.parse(raw) : []).filter(p => p.userId === userId);

        // On réutilise la structure "emission" existante : le nom de série (showName)
        // choisi dans ArtFlow Studio devient le champ de regroupement (type), exactement
        // comme la catégorie sur ACTV. Toute modification (ajout/suppression) se recalcule
        // automatiquement à chaque chargement, aucun état de regroupement n'est stocké à part.
        appState.emissions = myPubs.map(p => ({
            id: p.id,
            videoId: p.videoId,
            title: p.title,
            type: p.showName || 'Mes créations',
            duration: p.duration || 'N/A',
            description: p.description,
            views: p.views || '0',
            priority: p.priority || 'medium',
            videoUrl: p.videoUrl,
            thumbnail: p.thumbnail,
            publishedAt: p.publishedAt,
            status: p.status,
            promotedToActv: !!p.promotedToActv
        }));

        appState.emissions.sort((a, b) => {
            if (a.priority === 'high' && b.priority !== 'high') return -1;
            if (a.priority !== 'high' && b.priority === 'high') return 1;
            return new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0);
        });

        console.log(`✅ ${appState.emissions.length} vidéos`);
        groupEmissionsByType();
        renderEmissions();
        updateTotalCounter();
    } catch (e) {
        console.error('❌ Erreur:', e);
        showEmptyState();
        updateTotalCounter();
    }
}

        function updateTotalCounter() {
            const total = appState.emissions.length;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('totalMaxDisplay').textContent = TOTAL_LIMIT;
        }

        // Supprime une émission entière (et tous ses épisodes) de Ma Télé + ArtFlow.
        // La liste étant recalculée à chaque rendu, id/catégories se remettent à jour seuls.
        function deleteShow(showIndex, event) {
            if (event) event.stopPropagation();
            const show = appState.shows[showIndex];
            if (!show) return;

            const count = show.videos.length;
            const confirmMsg = count > 1
                ? `Supprimer l'émission "${show.label}" et ses ${count} épisodes ? Cette action est irréversible.`
                : `Supprimer la vidéo "${show.label}" ? Cette action est irréversible.`;
            if (!window.confirm(confirmMsg)) return;

            try {
                const raw = localStorage.getItem('artflow_user_publications');
                let pubs = raw ? JSON.parse(raw) : [];
                const idsToRemove = new Set(show.videos.map(v => v.id));
                pubs = pubs.filter(p => !idsToRemove.has(p.id));
                localStorage.setItem('artflow_user_publications', JSON.stringify(pubs));
            } catch (e) {
                console.error('Erreur suppression émission', e);
            }

            if (appState.currentShowIndex === showIndex) {
                closeMainPlayer();
            }
            showNotification(`🗑️ "${show.label}" supprimée`);
            loadData();
        }
        window.deleteShow = deleteShow;

        // Render émissions (groupées par catégorie = "shows" avec épisodes compilés)
        function renderEmissions() {
            const container = document.getElementById('popularShows');
            const emptyState = document.getElementById('emptyState');
            const countDisplay = document.getElementById('emissionCount');

            if (appState.emissions.length === 0) {
                showEmptyState();
                return;
            }

            emptyState.style.display = 'none';
            countDisplay.textContent = appState.shows.length;
            updateTotalCounter();

            container.innerHTML = appState.shows.map((show, showIndex) => {
                const firstEpisode = show.videos[0];
                let thumbnailContent = '';
                let thumbnailClass = 'show-thumbnail';

                if (firstEpisode.videoUrl) {
                    let videoSrc = firstEpisode.videoUrl;
                    if (!videoSrc.startsWith('http') && !videoSrc.startsWith('file://')) {
                        videoSrc = videoSrc.replace(/\\/g, '/');
                    }

                    thumbnailContent = `
                        <video 
                            id="preview-video-${showIndex}" 
                            muted 
                            loop 
                            playsinline
                            preload="metadata"
                            onerror="console.error('❌ Erreur vidéo preview ${showIndex}:', this.src)">
                            <source src="${videoSrc}" type="video/mp4">
                        </video>
                        <div class="video-badge-actv">ARTFLOW</div>
                        <div class="play-overlay">
                            <div class="play-btn-icon"></div>
                        </div>
                    `;
                } else if (firstEpisode.thumbnail) {
                    thumbnailContent = `
                        <img src="${firstEpisode.thumbnail}" alt="${show.label}">
                        <div class="play-overlay">
                            <div class="play-btn-icon"></div>
                        </div>
                    `;
                } else {
                    thumbnailClass += ` type-${show.type}`;
                    thumbnailContent = `
                        <div class="play-overlay">
                            <div class="play-btn-icon"></div>
                        </div>
                    `;
                }

                const isPlaying = showIndex === appState.currentShowIndex;
                const badge = isPlaying ? '<div class="now-playing-badge">▶ EN COURS</div>' : '';
                const episodesBadge = `<div class="episodes-count-badge">🎬 ${show.videos.length} ${show.videos.length > 1 ? 'épisodes' : 'épisode'}</div>`;
                const promotedBadge = show.videos.some(v => v.promotedToActv)
                    ? '<div style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.7);color:#ffd166;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;z-index:10;border:1px solid rgba(255,209,102,0.5);">🏆 Sur ACTV</div>'
                    : '';
                const catColor = getCategoryColor(show.type);

                return `
                    <div class="show-card ${isPlaying ? 'now-playing' : ''}" 
                         style="--cat-color: ${catColor}; position: relative;"
                         onclick="playShow(${showIndex}, ${isPlaying ? appState.currentEpisodeIndex : 0})" 
                         id="show-${showIndex}">
                        <button onclick="deleteShow(${showIndex}, event)" title="Supprimer cette émission" style="position:absolute; top:14px; right:14px; z-index:20; width:26px; height:26px; border-radius:50%; border:none; background:rgba(0,0,0,0.55); color:#fff; cursor:pointer; font-size:13px; line-height:1;">✕</button>
                        <div class="show-title"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${catColor};margin-right:8px;"></span>${show.label}</div>
                        <div class="${thumbnailClass}">
                            ${thumbnailContent}
                            ${episodesBadge}
                            ${badge}
                            ${promotedBadge}
                        </div>
                        <div class="show-stats">
                            <span>${firstEpisode.views || '0 vues'}</span>
                            <span>${show.videos.length} ${show.videos.length > 1 ? 'vidéos' : 'vidéo'}</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Démarrer les previews en respectant le volume général (muted par défaut au premier chargement)
            setTimeout(() => {
                document.querySelectorAll('.show-thumbnail video').forEach(video => {
                    video.muted = true; // requis par les navigateurs pour l'autoplay
                    video.volume = 0;
                    video.play().catch(() => {});
                });
            }, 300);

            console.log(`✅ ${appState.shows.length} émissions (${appState.emissions.length} vidéos) affichées`);
        }

        // Play show avec lecteur principal + lecture continue (playlist par émission)
        function playShow(showIndex, episodeIndex) {
            episodeIndex = episodeIndex || 0;
            if (showIndex < 0 || showIndex >= appState.shows.length) return;

            const show = appState.shows[showIndex];
            if (episodeIndex < 0 || episodeIndex >= show.videos.length) episodeIndex = 0;

            appState.currentShowIndex = showIndex;
            appState.currentEpisodeIndex = episodeIndex;
            appState.currentPlayingIndex = showIndex; // compatibilité

            const emission = show.videos[episodeIndex];

            const mainPlayer = document.getElementById('mainPlayer');
            const mainVideo = document.getElementById('mainVideo');
            const mainTitle = document.getElementById('mainPlayerTitle');
            const mainStats = document.getElementById('mainPlayerStats');

            if (emission.videoUrl) {
                let videoSrc = emission.videoUrl;
                if (!videoSrc.startsWith('http') && !videoSrc.startsWith('file://')) {
                    videoSrc = videoSrc.replace(/\\/g, '/');
                }

                mainVideo.src = videoSrc;
                mainVideo.muted = appState.globalMuted;
                mainVideo.volume = appState.globalVolume;
                mainTitle.textContent = `${show.label} — ${emission.title || 'Sans titre'}`;
                mainStats.textContent = `Épisode ${episodeIndex + 1}/${show.videos.length} • ${emission.views || '0 vues'} • ${emission.duration || 'N/A'}`;

                mainPlayer.style.display = 'block';
                mainPlayer.scrollIntoView({ behavior: 'smooth' });

                // Lecture continue : à la fin de l'épisode, passer au suivant
                mainVideo.onended = () => {
                    if (appState.autoplayNext) {
                        nextEpisode(true);
                    }
                };

                mainVideo.play();
            }

            renderEpisodesStrip(show, showIndex, episodeIndex);
            updateEpisodeNavButtons(show, episodeIndex);
            renderEmissions();
            showNotification(`▶ ${show.label} — ${emission.title || 'Sans titre'}`);
        }

        function renderEpisodesStrip(show, showIndex, activeEpisodeIndex) {
            const strip = document.getElementById('episodesStrip');
            if (show.videos.length <= 1) {
                strip.innerHTML = '';
                strip.style.display = 'none';
                return;
            }
            strip.style.display = 'flex';
            strip.innerHTML = show.videos.map((ep, epIndex) => {
                let thumb = '';
                if (ep.videoUrl) {
                    let src = ep.videoUrl;
                    if (!src.startsWith('http') && !src.startsWith('file://')) src = src.replace(/\\/g, '/');
                    thumb = `<video muted preload="metadata"><source src="${src}" type="video/mp4"></video>`;
                } else if (ep.thumbnail) {
                    thumb = `<img src="${ep.thumbnail}" alt="${ep.title}">`;
                }
                return `
                    <div class="episode-chip ${epIndex === activeEpisodeIndex ? 'active' : ''}" style="position:relative;" onclick="playShow(${showIndex}, ${epIndex})">
                        <button onclick="deleteEpisode(${showIndex}, ${epIndex}, event)" title="Supprimer cet épisode" style="position:absolute; top:6px; right:6px; z-index:5; width:20px; height:20px; border-radius:50%; border:none; background:rgba(0,0,0,0.6); color:#fff; cursor:pointer; font-size:11px; line-height:1;">✕</button>
                        <div class="ep-thumb">${thumb}</div>
                        <div class="ep-title">Ép. ${epIndex + 1} — ${ep.title || 'Sans titre'}</div>
                    </div>
                `;
            }).join('');
        }

        // Supprime un seul épisode d'une émission (la garde si d'autres épisodes restent)
        function deleteEpisode(showIndex, episodeIndex, event) {
            if (event) event.stopPropagation();
            const show = appState.shows[showIndex];
            if (!show) return;
            const ep = show.videos[episodeIndex];
            if (!ep) return;

            if (!window.confirm(`Supprimer l'épisode "${ep.title || 'Sans titre'}" ?`)) return;

            try {
                const raw = localStorage.getItem('artflow_user_publications');
                let pubs = raw ? JSON.parse(raw) : [];
                pubs = pubs.filter(p => p.id !== ep.id);
                localStorage.setItem('artflow_user_publications', JSON.stringify(pubs));
            } catch (e) {
                console.error('Erreur suppression épisode', e);
            }

            if (appState.currentShowIndex === showIndex) {
                closeMainPlayer();
            }
            showNotification(`🗑️ Épisode supprimé`);
            loadData();
        }
        window.deleteEpisode = deleteEpisode;

        function updateEpisodeNavButtons(show, episodeIndex) {
            document.getElementById('prevEpBtn').disabled = episodeIndex <= 0;
            document.getElementById('nextEpBtn').disabled = episodeIndex >= show.videos.length - 1;
        }

        function nextEpisode(fromAutoplay) {
            const show = appState.shows[appState.currentShowIndex];
            if (!show) return;
            const nextIndex = appState.currentEpisodeIndex + 1;
            if (nextIndex < show.videos.length) {
                playShow(appState.currentShowIndex, nextIndex);
            } else if (fromAutoplay) {
                showNotification(`✅ Fin de "${show.label}"`);
            }
        }

        function prevEpisode() {
            const show = appState.shows[appState.currentShowIndex];
            if (!show) return;
            const prevIndex = appState.currentEpisodeIndex - 1;
            if (prevIndex >= 0) {
                playShow(appState.currentShowIndex, prevIndex);
            }
        }

        function closeMainPlayer() {
            const mainPlayer = document.getElementById('mainPlayer');
            const mainVideo = document.getElementById('mainVideo');

            mainVideo.onended = null;
            mainVideo.pause();
            mainVideo.src = '';
            mainPlayer.style.display = 'none';

            appState.currentShowIndex = -1;
            appState.currentEpisodeIndex = -1;
            appState.currentPlayingIndex = -1;
            renderEmissions();
        }

        function showEmptyState() {
            document.getElementById('popularShows').innerHTML = '';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('emissionCount').textContent = '0';
        }

        // Raccourcis clavier
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                loadData();
                showNotification('🔄 Actualisation...');
            }
        });

        // Notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.9);
                color: white;
                padding: 15px 30px;
                border-radius: 25px;
                z-index: 1000;
                font-size: 14px;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }

        // Auto-refresh (30s) - DÉSACTIVÉ pour éviter la boucle
        let autoRefreshInterval = null;
        
        function startAutoRefresh() {
            if (autoRefreshInterval) return;
            autoRefreshInterval = setInterval(() => {
                const currentCount = appState.emissions.length;
                const raw = localStorage.getItem('artflow_user_publications');
                if (raw) {
                    const userId = getUserId();
                    const mine = JSON.parse(raw).filter(p => p.userId === userId);
                    if (mine.length > currentCount) {
                        loadData();
                        showNotification(`🎬 ${mine.length - currentCount} nouvelle(s) vidéo(s)`);
                    }
                }
            }, 30000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            initGlobalVolume();
            loadData();
            // startAutoRefresh(); // Décommentez si besoin
        });
    </script>
</body>
</html>
