<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>©ZNK - Dashboard Visiteur</title>
    <style>
        /* ==========================================
           RESET & VARIABLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --znk-bg-primary: #929292;
            --znk-bg-secondary: #53d5fd;
            --znk-bg-card: #929292;
            --znk-accent: #008cb4;
            --znk-accent-hover: #00a3d7;
            --znk-text-primary: #ffffff;
            --znk-text-secondary: #53d5fd;
            --znk-text-muted: #53d5fd;
            --znk-border: #53d5fd;
            --znk-glass: #1a0a53;
            --znk-success: #238636;
            --znk-warning: #d29922;
            --znk-danger: #da3633;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #606060 0%, #2c1376 50%, #929292 100%);
            color: var(--znk-text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            background: var(--znk-glass);
            backdrop-filter: blur(40px);
            border-bottom: 1px solid var(--znk-border);
            padding: 12px 16px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px #929292;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--znk-accent);
            cursor: pointer;
        }

        .search-container {
            position: relative;
            width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 8px 16px 8px 40px;
            background: var(--znk-bg-card);
            border: 1px solid var(--znk-border);
            border-radius: 20px;
            color: var(--znk-text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--znk-accent);
            box-shadow: 0 0 0 2px #b1dd8c;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--znk-bg-card);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            overflow: hidden;
            position: relative;
        }

        .header-btn:hover {
            background: var(--znk-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px #929292;
        }

        .header-btn img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        /* Variante rectangulaire pour le bouton Studios : plus large,
           coins arrondis au lieu du cercle, pour se démarquer des
           autres icônes rondes du header (messages, notifications...) */
        .header-btn.studio {
            width: 77px;
            height: 45px;
            border-radius: 12px;
        }

        .header-btn.studio img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .user-avatar-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--znk-accent), #667eea);
            border: 2px solid #929292;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .user-avatar-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #929292;
        }

        .user-avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* LAYOUT PRINCIPAL */
        .main-layout {
            margin-top: 60px;
            display: grid;
            grid-template-columns: 120px 1fr 380px;
            gap: 24px;
            padding: 24px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
            transition: grid-template-columns 0.3s ease;
            height: calc(100vh - 84px);
        }

        .main-layout.no-sidebar-right {
            grid-template-columns: 120px 1fr;
        }

        /* SIDEBAR GAUCHE */
        .sidebar-left {
            position: sticky;
            top: 80px;
            height: fit-content;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .nav-section {
            background: var(--znk-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 12px;
            color: var(--znk-text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #929292;
            transform: scale(1.05);
            box-shadow: 0 4px 12px #929292;
        }

        .icon-placeholder {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            background: linear-gradient(135deg, #929292, rgba(16,185,129,0.06));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #929292;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .icon-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: inherit;
        }

        .icon-placeholder[data-role="user-p"] {
            cursor: pointer;
            border: 2px solid #929292;
        }

        .icon-placeholder[data-role="user-profile"]:hover {
            border-color: var(--znk-accent);
            box-shadow: 0 0 20px #929292;
        }

        /* MODULE CONTAINER */
        .module-container {
            background: var(--znk-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border);
            border-radius: 16px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #moduleContainer {
            width: 100%;
            flex: 1;
            overflow: hidden;
            padding: 0;
            position: relative;
        }

        #moduleContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            display: block;
        }

        .module-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--znk-border);
            border-top-color: var(--znk-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner-text {
            margin-top: 16px;
            color: var(--znk-text-secondary);
            font-size: 14px;
        }

        /* SIDEBAR DROITE */
        .sidebar-right {
            position: sticky;
            top: 80px;
            height: fit-content;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .sidebar-right.hidden {
            display: none;
        }

        .widget {
            background: var(--znk-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .widget-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--znk-accent);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .widget-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .widget-item:hover { background: #929292; }

        .widget-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--znk-accent), #00a3d7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 14px;
            overflow: hidden;
        }

        .widget-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .widget-info { flex: 1; }
        .widget-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .widget-desc { font-size: 11px; color: var(--znk-text-muted); }

        .widget-open-btn {
            width: 100%;
            margin-top: 10px;
            padding: 9px;
            background: var(--znk-bg-card);
            border: 1px solid var(--znk-border);
            color: var(--znk-text-primary);
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .widget-open-btn:hover {
            background: var(--znk-accent);
            border-color: var(--znk-accent);
        }

        .widget-avatar { position: relative; flex-shrink: 0; }

        .widget-online-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--znk-success);
            border: 2px solid var(--znk-glass);
        }

        .widget-count-badge {
            margin-left: auto;
            background: rgba(35, 134, 54, 0.15);
            color: var(--znk-success);
            border: 1px solid var(--znk-success);
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .widget-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .widget-title-row .widget-title { margin-bottom: 0; }

        .contact-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--znk-border);
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--znk-text-primary);
            font-size: 13px;
            font-family: inherit;
            margin-bottom: 8px;
        }

        .contact-field:focus {
            outline: none;
            border-color: var(--znk-accent);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea.contact-field {
            resize: vertical;
            min-height: 60px;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */

        /* TABLETTE : on garde 3 colonnes mais on resserre */
        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 100px 1fr 320px;
                gap: 16px;
            }
        }

        /* TABLETTE PORTRAIT / PETITE TABLETTE : sidebar droite passe sous le contenu */
        @media (max-width: 1024px) {
            .main-layout,
            .main-layout.no-sidebar-right {
                grid-template-columns: 90px 1fr;
                height: auto;
            }
            .sidebar-right {
                position: static;
                max-height: none;
                grid-column: 1 / -1;
            }
            .module-container { min-height: 70vh; }
        }

        /* MOBILE : tout en colonne, nav en bas, sidebar droite masquée par défaut */
        @media (max-width: 768px) {
            body { overflow-x: hidden; }

            .header { padding: 10px 12px; }
            .logo { font-size: 18px; }
            .search-container { display: none; }
            .header-btn { width: 40px; height: 40px; }
            .header-btn img { width: 22px; height: 22px; }
            .header-btn.studio { width: 56px; height: 36px; }
            .user-avatar-btn { width: 38px; height: 38px; }
            #statTime { display: none; }
            .header-right { gap: 6px; }

            .main-layout {
                margin-top: 56px;
                grid-template-columns: 1fr;
                padding: 12px 12px 84px 12px; /* padding-bottom = place pour la nav fixe en bas */
                gap: 12px;
                height: auto;
                min-height: calc(100dvh - 56px);
            }
            .main-layout.no-sidebar-right { grid-template-columns: 1fr; }

            .sidebar-left {
                position: fixed;
                bottom: 0; left: 0; right: 0; top: auto;
                width: 100%; height: auto; z-index: 900;
                background: var(--znk-glass);
                backdrop-filter: blur(20px);
                border-top: 1px solid var(--znk-border);
                padding: 6px 8px;
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .sidebar-left .nav-section {
                flex-direction: row;
                flex-wrap: nowrap;
                margin-bottom: 0;
                border: none;
                background: transparent;
                padding: 4px;
                gap: 8px;
            }
            .icon-placeholder { width: 46px; height: 46px; }

            .module-container { min-height: 60vh; border-radius: 12px; }

            .sidebar-right {
                grid-column: 1 / -1;
                /* !important nécessaire : le JS de loadModule() met un style inline
                   display:block sur cette sidebar pour certains modules (profil, mur).
                   Sur mobile on ne veut jamais l'afficher, faute de place. */
                display: none !important;
            }
        }

        /* TRES PETIT ECRAN */
        @media (max-width: 420px) {
            .logo { font-size: 16px; }
            .header-btn { width: 36px; height: 36px; }
            .header-btn.studio { width: 50px; height: 34px; }
            .icon-placeholder { width: 42px; height: 42px; }
            .widget { padding: 14px; }
        }

        /* ==========================================
           RESTRICTION VISITEUR - RESERVE AUX MEMBRES
           ========================================== */

        /* Badge cadenas sur les icônes de nav verrouillées */
        .nav-link.locked {
            position: relative;
        }

        .nav-link.locked .icon-placeholder {
            opacity: 0.55;
            filter: grayscale(40%);
        }

        .nav-link.locked::after {
            content: '🔒';
            position: absolute;
            top: -2px;
            right: -2px;
            font-size: 13px;
            background: var(--znk-glass);
            border: 1px solid var(--znk-border);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .widget-open-btn.locked-btn {
            position: relative;
        }

        .widget-open-btn.locked-btn::before {
            content: '🔒 ';
        }

        /* Overlay affiché par-dessus un module verrouillé : le contenu reste
           visible en transparence derrière, mais toute interaction est
           bloquée et un message "réservé aux membres" s'affiche. */
        .member-lock-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: rgba(10, 5, 40, 0.62);
            backdrop-filter: blur(2px);
            cursor: not-allowed;
        }

        .member-lock-overlay .lock-icon {
            font-size: 48px;
            margin-bottom: 14px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }

        .member-lock-overlay .lock-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            background: var(--znk-danger);
            padding: 8px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            margin-bottom: 10px;
        }

        .member-lock-overlay .lock-desc {
            font-size: 14px;
            color: var(--znk-text-secondary);
            max-width: 340px;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #929292; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #929292; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--znk-accent); }
    </style>
    <!-- ZNK P2P Manager -->
<script src="/js/znk-p2p-manager.js"></script>
<script>
    // Initialiser le manager P2P global
    let znkP2P = null;
    
    document.addEventListener('DOMContentLoaded', () => {
        znkP2P = new ZNKP2PManager({
            apiUrl: 'https://api.znk.app/v1'  // Votre URL API
        });
        
        console.log('📡 P2P Manager initialisé');
        
        // Afficher les stats dans la console
        const stats = znkP2P.getStats();
        console.log('📊 Stats P2P:', stats);
    });
</script>
<script src="/js/znk-session.js"></script>
<script src="/js/znk-user-widget.js"></script>
</head>

        </aside>

    <script>

            'publish': { name: 'Publish', path: './modules-admin/actvAdminPublish.html' },
            'user-video-manager': { name: 'user-video-manager', path: './modules/user-video-manager.html' },

              'gallery': { name: 'Gallery', path: './gallery.html' },
            'audio-manager': { name: 'Audio Manager', path: './modules-admin/audioManager.html' },
            'user-video-manager': { name: 'user-video-manager', path: './modules/user-video-manager.html' },
            'radio': { name: 'radio', path: './radio.html' },
             'radio-user': { name: 'radio-user', path: './modules/radio-user.html' },
            'whatsznk': { name: 'WhatsZNK', path: './whatsznk.html' },
            'video-converter': { name: 'VideoConverter', path: './modules-admin/video-converter.html' },
            'devenir-membre': { name: 'Devenir Membre', path: './modules/devenir-membre.html', needsElectronAPI: false }
            
        };

      // Charger un module - AVEC GESTION SIDEBAR DROITE
function loadModule(moduleName) {
    console.log('📂 Chargement du module:', moduleName);
    
    const container = document.getElementById('moduleContainer');
    const sidebarRight = document.querySelector('.sidebar-right');
    const mainLayout = document.querySelector('.main-layout');
    
    // DIAGNOSTIC COMPLET
    console.log('🔍 Diagnostic sidebar droite:');
    console.log('  - sidebarRight existe?', !!sidebarRight);
    console.log('  - mainLayout existe?', !!mainLayout);
    if (sidebarRight) {
        console.log('  - Classes actuelles:', sidebarRight.className);
        console.log('  - Style display actuel:', sidebarRight.style.display);
        console.log('  - Computed display:', window.getComputedStyle(sidebarRight).display);
    }
    
    // AFFICHER la sidebar droite pour user-profile ET le Mur
    if (moduleName === 'user-profile' || moduleName === 'wall') {
        console.log('👤 Profil/Mur détecté - Affichage sidebar droite');
        
        if (sidebarRight) {
            // Retirer TOUTES les classes qui pourraient masquer
            sidebarRight.classList.remove('hidden');
            sidebarRight.classList.remove('d-none');
            
            // Forcer l'affichage avec !important via style inline
            sidebarRight.style.display = 'block';
            sidebarRight.style.visibility = 'visible';
            sidebarRight.style.opacity = '1';
            
            console.log('✅ Sidebar droite affichée');
            console.log('  - Nouvelles classes:', sidebarRight.className);
            console.log('  - Nouveau display:', sidebarRight.style.display);

            loadOnlineUsers();
            loadFidaSocialPreview();
        } else {
            console.error('❌ .sidebar-right introuvable dans le DOM!');
        }
        
        if (mainLayout) {
            mainLayout.classList.remove('no-sidebar-right');
            console.log('✅ Classe no-sidebar-right retirée du main-layout');
        }
    } else {
        console.log('📦 Autre module - Masquage sidebar droite');
        
        if (sidebarRight) {
            sidebarRight.classList.add('hidden');
            sidebarRight.style.display = 'none';
        }
        if (mainLayout) {
            mainLayout.classList.add('no-sidebar-right');
        }
    }

    const moduleConfig = MODULES_CONFIG[moduleName];
    if (!moduleConfig) {
        console.error(`❌ Module ${moduleName} non trouvé dans la config`);
        container.innerHTML = `
            <div class="module-loading">
                <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                <div style="color: var(--znk-text-secondary);">Module "${moduleName}" non trouvé</div>
            </div>
        `;
        return;
    }

    console.log('✅ Config trouvée:', moduleConfig);

    // Afficher le loader
    container.innerHTML = `
        <div class="module-loading">
            <div class="spinner"></div>
            <div class="spinner-text">Chargement de ${moduleConfig.name}...</div>
        </div>
    `;

            // Charger le module après un court délai
            //
            // Modules qui ont besoin de window.electronAPI (ex: video-converter,
            // audio-manager, et par défaut tous les autres) doivent être chargés en
            // <webview> avec leur PROPRE preload : une <iframe> classique ne reçoit
            // jamais le preload de la fenêtre parente dans Electron.
            //
            // Comportement : webview (avec electronAPI) PAR DÉFAUT pour tout module.
            // Pour désactiver explicitement sur un module qui n'en a pas besoin,
            // ajoute `needsElectronAPI: false` dans sa config dans MODULES_CONFIG.
            setTimeout(async () => {
                console.log('🔄 Création du module vers:', moduleConfig.path);

                const needsElectronAPI = moduleConfig.needsElectronAPI !== false;

                if (needsElectronAPI && window.electronAPI && typeof window.electronAPI.getPreloadPath === 'function') {
                    try {
                        const preloadUrl = await window.electronAPI.getPreloadPath();
                        container.innerHTML = `
                            <webview
                                id="moduleIframe"
                                src="${moduleConfig.path}"
                                preload="${preloadUrl}"
                                webpreferences="contextIsolation=yes, nodeIntegration=no"
                                style="width:100%; height:100%; border:none; border-radius:12px;"
                                title="${moduleConfig.name}"
                            ></webview>
                        `;
                        const wv = document.getElementById('moduleIframe');
                        wv.addEventListener('dom-ready', () => console.log('✅ Webview prête:', '${moduleName}'));
                        wv.addEventListener('did-fail-load', (e) => console.error('❌ Erreur chargement webview:', '${moduleName}', e));
                    } catch (err) {
                        console.error('❌ Impossible de récupérer le chemin du preload, fallback iframe:', err);
                        container.innerHTML = `
                            <iframe 
                                id="moduleIframe"
                                src="${moduleConfig.path}" 
                                style="width:100%; height:100%; border:none; border-radius:12px;"
                                title="${moduleConfig.name}"
                                sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
                                onload="console.log('✅ Iframe chargée:', '${moduleName}')"
                                onerror="console.error('❌ Erreur chargement iframe:', '${moduleName}')"
                            ></iframe>
                        `;
                    }
                } else {
                    container.innerHTML = `
                        <iframe 
                            id="moduleIframe"
                            src="${moduleConfig.path}" 
                            style="width:100%; height:100%; border:none; border-radius:12px;"
                            title="${moduleConfig.name}"
                            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
                            onload="console.log('✅ Iframe chargée:', '${moduleName}')"
                            onerror="console.error('❌ Erreur chargement iframe:', '${moduleName}')"
                        ></iframe>
                    `;
                }

                // VISITEUR : si le module est réservé aux membres, on laisse le
                // contenu se charger (visible en transparence) mais on pose un
                // voile bloquant par-dessus pour empêcher toute interaction.
                if (RESTRICTED_MODULES.includes(moduleName)) {
                    applyMemberLockOverlay(container, moduleConfig.name);
                }

                setActiveModule(moduleName);
            }, 300);
        }

        // Pose le voile "RÉSERVÉ AUX MEMBRES" par-dessus le module chargé.
        // Le contenu du module reste visible en transparence derrière le
        // voile, mais pointer-events est désactivé sur l'iframe/webview afin
        // qu'aucune interaction ne soit possible.
        function applyMemberLockOverlay(container, moduleLabel) {
            const frame = container.querySelector('#moduleIframe');
            if (frame) frame.style.pointerEvents = 'none';

            const overlay = document.createElement('div');
            overlay.className = 'member-lock-overlay';
            overlay.innerHTML = `
                <div class="lock-icon">🔒</div>
                <div class="lock-title">RÉSERVÉ AUX MEMBRES</div>
                <div class="lock-desc">${moduleLabel} est visible en aperçu mais son utilisation est réservée aux membres ZNK. Devenez membre pour y accéder pleinement.</div>
            `;
            container.appendChild(overlay);
        }

        function setActiveModule(moduleName) {
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            const el = document.querySelector(`.nav-link [data-role="${moduleName}"]`);
            if (el && el.closest('.nav-link')) {
                el.closest('.nav-link').classList.add('active');
            }
        }

        // ========================================
        // WIDGETS SIDEBAR DROITE (visibles sur user-profile & wall)
        // ========================================
        function getWidgetInitials(name) {
            const parts = String(name).split(' ').filter(p => p.length > 0);
            if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            return String(name).substring(0, 2).toUpperCase();
        }

        // Utilisateurs connectés (simulation P2P - à remplacer par la vraie présence réseau)
        function loadOnlineUsers() {
            const listEl = document.getElementById('onlineUsersList');
            const countEl = document.getElementById('onlineUsersCount');
            if (!listEl) return;

            let currentUser = null;
            try { currentUser = JSON.parse(localStorage.getItem('znkUserData') || 'null'); } catch (e) {}
            const myName = currentUser ? `${currentUser.prenom || ''} ${currentUser.nom || ''}`.trim() : '';

            const onlineUsers = [
                { name: 'Alice_ZNK', status: 'En studio' },
                { name: 'Bob_Creator', status: 'Écoute une radio' },
                { name: 'Charlie_Dev', status: 'En ligne' },
                { name: myName || 'Vous', status: 'C\'est vous' }
            ];

            listEl.innerHTML = onlineUsers.map(u => `
                <div class="widget-item">
                    <div class="widget-avatar">${getWidgetInitials(u.name)}<div class="widget-online-dot"></div></div>
                    <div class="widget-info">
                        <div class="widget-name">${u.name}</div>
                        <div class="widget-desc">${u.status}</div>
                    </div>
                </div>
            `).join('');

            if (countEl) countEl.textContent = onlineUsers.length;
        }

        // Contactez-moi
        function sendContactMessage(event) {
            event.preventDefault();

            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const message = document.getElementById('contactMessage').value.trim();

            if (!name || !email || !message) return false;

            let currentUser = null;
            try { currentUser = JSON.parse(localStorage.getItem('znkUserData') || 'null'); } catch (e) {}

            const contactMessages = JSON.parse(localStorage.getItem('znkContactMessages') || '[]');
            contactMessages.unshift({
                id: Date.now(),
                name, email, message,
                to: currentUser?.id || 'ZNK-000000',
                timestamp: Date.now()
            });
            localStorage.setItem('znkContactMessages', JSON.stringify(contactMessages));

            document.getElementById('contactForm').reset();
            console.log('✅ Message de contact envoyé');
            return false;
        }

        // Aperçu des dernières publications FIDA-Social
        function loadFidaSocialPreview() {

            let posts = [];

        // Charger les icônes depuis le manifest
        async function applyIconsFromManifest() {
            try {
                const manifestPath = './icons/icons-intro-manifest.json';
                console.log('🔍 Chargement manifest depuis:', manifestPath);
                
                const res = await fetch(manifestPath);
                if (!res.ok) {
                    console.warn('⚠️ Manifest non trouvé:', manifestPath);
                    console.log('Utilisation des placeholders par défaut');
                    return;
                }
                
                const data = await res.json();
                const icons = Array.isArray(data.icons) ? data.icons : Object.values(data.icons || {});

                console.log('📦 Manifest chargé avec', icons.length, 'icônes');

                icons.forEach(ic => {
                    const candidates = [ic.id, ic.name, ic.filename, ic.src, ic.role].filter(Boolean);
                    candidates.forEach(c => {
                        const role = String(c).replace(/\.(png|jpg|jpeg|svg)$/i, '').toLowerCase();
                        
                        // Appliquer aux placeholders
                        const elements = document.querySelectorAll(`.icon-placeholder[data-role="${role}"]`);
                        elements.forEach(el => {
                            let iconSrc = ic.src || ic.filename || ic.path;
                            
                            if (iconSrc && !iconSrc.startsWith('./') && !iconSrc.startsWith('http')) {
                                iconSrc = `./icons/${iconSrc}`;
                            } else if (!iconSrc) {
                                iconSrc = `./icons/${role}.svg`;
                            }
                            
                            el.innerHTML = `<img src="${iconSrc}" alt="${role}">`;
                            el.style.background = 'transparent';
                            el.style.border = 'none';
                            console.log('✓ Icône sidebar appliquée:', role, '->', iconSrc);
                        });

                        // Appliquer aux images header
                        const headerImgs = document.querySelectorAll(`.header-btn img[alt="${role}"]`);
                        headerImgs.forEach(img => {
                            let iconSrc = ic.src || ic.filename || ic.path;
                            if (iconSrc && !iconSrc.startsWith('./') && !iconSrc.startsWith('http')) {
                                iconSrc = `./icons/${iconSrc}`;
                            }
                            if (iconSrc) {
                                img.src = iconSrc;
                                console.log('✓ Icône header appliquée:', role, '->', iconSrc);
                            }
                        });
                    });
                });
                
                console.log('✅ Toutes les icônes ont été appliquées');
            } catch (e) {
                console.error('❌ Erreur chargement manifest:', e);
                console.log('Utilisation des placeholders par défaut');
            }
        }
// Fonction pour garantir la persistance des vidéos ACTV
function ensureACTVPersistence() {
    // Récupération des vidéos depuis le stockage local
    const savedVideos = localStorage.getItem('actv_published_videos');
    
    if (savedVideos) {
        const videoData = JSON.parse(savedVideos);
        console.log('✅ Vidéos ACTV restaurées:', videoData.length, 'vidéos');
        
        // Réinjecter les vidéos dans la section appropriée
        displaySavedVideos(videoData);
    } else {
        console.log('ℹ️ Aucune vidéo ACTV sauvegardée trouvée');
    }
}

// Affiche les vidéos sauvegardées dans la section ACTV
function displaySavedVideos(videos) {
    const actvContainer = document.querySelector('.actv-videos-container') || 
                        document.getElementById('actvVideosSection');
    
    if (!actvContainer) {
        console.warn('⚠️ Section ACTV non trouvée');
        return;
    }
    
    // Conserver les vidéos existantes avant d'ajouter
    const existingHTML = actvContainer.innerHTML;
    
    // Ajouter les vidéos sauvegardées
    let newContent = '';
    
    videos.forEach(video => {
        newContent += `
            <div class="video-item" data-id="${video.id || Date.now()}">
                <div class="video-thumbnail" style="background-image: url('${video.thumbnail || 'assets/default-thumb.jpg'}')">
                    <div class="video-duration">${video.duration || '00:00'}</div>
                    <div class="video-play-button">▶️</div>
                </div>
                <div class="video-info">
                    <h3 class="video-title">${video.title || 'Vidéo sans titre'}</h3>
                    <p class="video-description">${video.description || 'Aucune description'}</p>
                    <div class="video-meta">
                        <span class="video-views">${video.views || '0'} vues</span>
                        <span class="video-date">${video.date || new Date().toLocaleDateString()}</span>
                    </div>
                </div>
            </div>
        `;
    });
    
    // Ne remplacer que si nous avons du contenu à ajouter
    if (newContent) {
        // Vérifier si le contenu existe déjà pour éviter la duplication
        if (!existingHTML.includes(newContent)) {
            actvContainer.innerHTML = existingHTML + newContent;
        }
    }
}

// Fonction pour sauvegarder une nouvelle vidéo
function saveACTVVideo(videoData) {
    // Récupérer les vidéos existantes
    const savedVideos = localStorage.getItem('actv_published_videos');
    let videos = [];
    
    if (savedVideos) {
        videos = JSON.parse(savedVideos);
    }
    
    // Ajouter la nouvelle vidéo
    videos.push({
        id: videoData.id || Date.now(),
        title: videoData.title,
        description: videoData.description,
        thumbnail: videoData.thumbnail,
        duration: videoData.duration,
        views: videoData.views || '0',
        date: videoData.date || new Date().toLocaleDateString()
    });
    
    // Sauvegarder dans localStorage
    localStorage.setItem('actv_published_videos', JSON.stringify(videos));
    console.log('✅ Nouvelle vidéo ACTV sauvegardée');
    
    // Afficher la nouvelle vidéo
    displaySavedVideos([videoData]);
}

// Ajouter au chargement de la page
document.addEventListener('DOMContentLoaded', function() {
    // Restaurer les vidéos ACTV
    ensureACTVPersistence();
    
    // Observer les changements de module pour s'assurer que les vidéos ACTV restent visibles
    const moduleContainer = document.getElementById('moduleContainer');
    
    if (moduleContainer) {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    // Vérifier si nous sommes dans le module ACTV
                    const actvElement = document.querySelector('[data-module="actv"]') || 
                                       document.querySelector('.actv-container');
                    
                    if (actvElement) {
                        console.log('🔄 Module ACTV détecté, restauration des vidéos');
                        ensureACTVPersistence();
                    }
                }
            });
        });
        
        observer.observe(moduleContainer, { childList: true, subtree: true });
    }
});
