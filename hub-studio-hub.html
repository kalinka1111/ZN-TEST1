<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>©ZNKsystem - Studios</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:linear-gradient(135deg,#0a0a0a 0%,#004d65 50%,#16213e 100%); overflow:hidden; height:100vh; }
.hub-back-bar { height:50px; background:linear-gradient(90deg,rgba(30,39,58,.95),rgba(20,28,46,.95)); backdrop-filter:blur(15px); border-bottom:2px solid rgba(0,255,255,.3); display:flex; align-items:center; padding:0 20px; gap:15px; }
.back-button { display:flex; align-items:center; gap:8px; background:linear-gradient(135deg,#00ffff,#0080ff); color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:14px; transition:all .3s ease; }
.back-button:hover { transform:translateY(-2px); box-shadow:0 0 20px rgba(0,255,255,.5); }
.hub-title { font-size:18px; font-weight:bold; background:linear-gradient(135deg,#00ffff,#0080ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:1px; }
.hub-container { height:calc(100vh - 50px); display:flex; justify-content:center; align-items:center; }
.phone-container { width:375px; margin:30px auto; position:relative; border-radius:40px; background:#000; box-shadow:0 0 50px rgba(0,255,255,.3); border:3px solid #00ffff; overflow:hidden; height:calc(100vh - 110px); }
.status-bar { height:44px; background:rgba(0,0,0,.9); display:flex; justify-content:space-between; align-items:center; padding:0 20px; color:#fff; font-size:14px; font-weight:600; }
.app-pages { height:calc(100% - 44px - 90px); position:relative; overflow:hidden; }
.app-page { position:absolute; top:0; left:0; width:100%; height:100%; padding:20px 28px; overflow-y:auto; transition:transform .3s ease; transform:translateX(100%); }
.app-page.active { transform:translateX(0); }
.app-page.prev { transform:translateX(-100%); }
.page-dots { position:absolute; bottom:96px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:10; }
.page-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3); cursor:pointer; transition:all .2s ease; }
.page-dot.active { background:#00ffff; box-shadow:0 0 8px rgba(0,255,255,.6); width:20px; border-radius:4px; }
.page-header { text-align:center; margin-bottom:20px; }
.page-logo { font-size:30px; font-weight:bold; background:linear-gradient(135deg,#00ffff,#0080ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:3px; }
.page-subtitle { font-size:11px; color:rgba(255,255,255,.6); letter-spacing:1px; text-transform:uppercase; }
.app-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:30px; min-height:372px; }
.app-icon { width:75px; height:75px; border-radius:18px; cursor:pointer; transition:all .2s ease; box-shadow:0 4px 15px rgba(0,0,0,.3); background-size:cover; background-position:center; margin:0 auto; }
.app-icon:active { transform:scale(.9); }
.app-icon.emoji-tile { background:linear-gradient(135deg,rgba(0,255,255,.15),rgba(0,128,255,.12)); border:2px solid rgba(0,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:32px; }
.dock { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,.1); backdrop-filter:blur(20px); border-radius:25px; padding:8px; display:flex; gap:8px; border:1px solid rgba(255,255,255,.2); }
.dock-item { width:60px; height:60px; background-size:cover; background-position:center; border-radius:15px; cursor:pointer; }
.dock-item.emoji-tile { background:linear-gradient(135deg,rgba(0,255,255,.15),rgba(0,128,255,.12)); border:2px solid rgba(0,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:26px; }
.studio-viewer { position:fixed; inset:0; background:#0a0a0a; z-index:9000; display:none; flex-direction:column; }
.studio-viewer.active { display:flex; }
.studio-viewer-bar { height:50px; flex-shrink:0; background:linear-gradient(90deg,rgba(30,39,58,.95),rgba(20,28,46,.95)); border-bottom:2px solid rgba(0,255,255,.3); display:flex; align-items:center; gap:15px; padding:0 20px; }
.studio-viewer-title { color:#00ffff; font-weight:bold; font-size:14px; }
.studio-viewer-frame { flex:1; width:100%; border:none; background:#fff; }
.notification { position:fixed; top:70px; right:20px; background:rgba(0,255,255,.9); color:#000; padding:15px 25px; border-radius:10px; z-index:10000; font-weight:bold; display:none; }
.notification.show { display:block; }
@media (max-width:480px){ .phone-container{ width:100%; margin:0; border-radius:0; border:none; height:calc(100vh - 50px); } .hub-subtitle{ display:none; } }
</style>
</head>
<body>
<div class="hub-back-bar">
<button class="back-button" onclick="returnToParentHub()">← Retour</button>
<div class="hub-title">Studios</div>
</div>
<div class="hub-container">
<div class="phone-container">
<div class="status-bar"><div id="currentTime">12:35</div><div style="color:#00ffff;">Studios</div></div>
<div class="app-pages" id="appPages"><div class="app-page active" id="page1">
<div class="page-header"><div class="page-logo">STUDIOS</div><div class="page-subtitle">Studios</div></div>
<div class="app-grid" id="grid1"></div>
</div>
<div class="app-page" id="page2">
<div class="page-header"><div class="page-logo">STUDIOS</div><div class="page-subtitle">Page 2</div></div>
<div class="app-grid" id="grid2"></div>
</div></div>
<div class="page-dots" id="pageDots"><div class="page-dot active" onclick="switchPageExp(0)"></div><div class="page-dot" onclick="switchPageExp(1)"></div></div>
<div class="dock" id="dock"></div>
</div>
</div>
<div class="studio-viewer" id="studioViewer">
<div class="studio-viewer-bar"><button class="back-button" onclick="closeStudioViewer()">← Retour au Hub</button><div class="studio-viewer-title" id="studioViewerTitle">Studio</div></div>
<iframe class="studio-viewer-frame" id="studioViewerFrame" style="display:flex;"></iframe>
</div>
<div class="notification" id="notification"></div>
<script>
var hubConfigData = {"page1":[{"name":"Artflow Publish Studio","icon":"./icons/artflow-publish-studio.svg","target":"./modules/artflow-publish-studio.html","targetType":"studio"},{"name":"Expo Manager","icon":"./icons/expo-manager.svg","target":"./modules/expo-manager.html","targetType":"studio"},{"name":"User Publish Radio","icon":"./icons/user-publish-radio.svg","target":"./user-publish-radio.html","targetType":"studio"},{"name":"Icon Maker","icon":"./icons/icon-maker.svg","target":"./modules/icon-maker.html","targetType":"studio"},{"name":"Affiche Studio","icon":"./icons/affiche.svg","target":"./modules/affiche.html","targetType":"studio"},{"name":"Dessin Studio","icon":"./icons/dessin.svg","target":"./modules/dessin.html","targetType":"studio"},{"name":"LIVE","icon":"./icons/Live.svg","target":"./modules/Live.html","targetType":"studio"},{"name":"LIVRE MOI","icon":"./icons/livremoi.svg","target":"./modules-etudes/ZNK-LIVREmoi.html","targetType":"studio"},{"name":"Scenario","icon":"./icons/ZNKScenario.svg","target":"./modules/ZNKScenario.html","targetType":"studio"}],"dock":[{"name":"Ma tele","icon":"./icons/ma-tele.svg","target":"./modules/ma-tele.html","targetType":"studio"},{"name":"Ma Radio","icon":"./icons/ma-radio.svg","target":"./modules/ma-radio.html","targetType":"studio"},{"name":"Mon Expo","icon":"./icons/ZNKexpos.svg","target":"./modules/mon-expo.html","targetType":"studio"}],"page2":[{"name":"ZNKMouvement","icon":"./icons/ZNKMouvement.svg","target":"./modules/ZNKMouvement.html","targetType":"studio"},{"name":"ZNKAnim","icon":"./icons/ZNKAnim.svg","target":"./modules/ZNKAnim.html","targetType":"studio"},{"name":"ZNKFadeVideo","icon":"./icons/ZNKFadeVideo.svg","target":"./modules/ZNKFadeVideo.html","targetType":"studio"},{"name":"ZNKTransitions","icon":"./icons/ZNKTransitions.svg","target":"./modules/ZNKTransitions.html","targetType":"studio"},{"name":"music-studio","icon":"./icons/music-studio.svg","target":"./modules/music-studio.html","targetType":"studio"},{"name":"ZNKVitesseVideo","icon":"./icons/ZNKVitesseVideo.svg","target":"./modules/ZNKVitesseVideo.html","targetType":"studio"}]};
var parentHubUrl = new URLSearchParams(window.location.search).get("parent") || "./ZNKMembresDash.html";
var hubTitleData = "Studios";
// main.js lance la fenêtre avec contextIsolation: true / nodeIntegration:
// false par défaut : `require` n'est jamais injecté ici. L'API réelle
// est exposée par preload.js via window.electronAPI (contextBridge).
var api = window.electronAPI || null;
var isElectronExp = !!api;
function isImagePathExp(icon) { if (!icon) return false; return /^(https?:|data:|\.\/|\.\.\/|\/)/i.test(icon) || /\.(png|jpe?g|svg|gif|webp)$/i.test(icon); }
function createIconExp(app) { var div = document.createElement("div"); div.className = "app-icon"; if (isImagePathExp(app.icon)) { div.style.backgroundImage = "url(\"" + app.icon + "\")"; } else { div.classList.add("emoji-tile"); div.textContent = app.icon; } div.title = app.name; div.onclick = function(){ openAppExp(app); }; return div; }
function createDockExp(app) { var div = document.createElement("div"); div.className = "dock-item"; if (isImagePathExp(app.icon)) { div.style.backgroundImage = "url(\"" + app.icon + "\")"; } else { div.classList.add("emoji-tile"); div.textContent = app.icon; } div.title = app.name; div.onclick = function(){ openAppExp(app); }; return div; }
function renderExp() { var grid = document.getElementById("grid1"); var grid2 = document.getElementById("grid2"); var dock = document.getElementById("dock"); grid.innerHTML = ""; grid2.innerHTML = ""; dock.innerHTML = ""; hubConfigData.page1.forEach(function(app){ grid.appendChild(createIconExp(app)); }); (hubConfigData.page2 || []).forEach(function(app){ grid2.appendChild(createIconExp(app)); }); hubConfigData.dock.forEach(function(app){ dock.appendChild(createDockExp(app)); }); }
var currentPageIndexExp = 0;
function switchPageExp(index) { currentPageIndexExp = index; var pages = [document.getElementById("page1"), document.getElementById("page2")]; pages.forEach(function(page, i){ page.classList.remove("active", "prev"); if (i === index) page.classList.add("active"); else if (i < index) page.classList.add("prev"); }); document.querySelectorAll("#pageDots .page-dot").forEach(function(dot, i){ dot.classList.toggle("active", i === index); }); }
(function(){ var c = document.getElementById("appPages"); if (!c) return; var startX = 0; c.addEventListener("touchstart", function(e){ startX = e.touches[0].clientX; }, { passive: true }); c.addEventListener("touchend", function(e){ var diff = e.changedTouches[0].clientX - startX; if (Math.abs(diff) < 40) return; if (diff < 0 && currentPageIndexExp === 0) switchPageExp(1); else if (diff > 0 && currentPageIndexExp === 1) switchPageExp(0); }, { passive: true }); })();
function openAppExp(app) { if (app.targetType === "studio") { openStudioViewerExp(app); } else if (app.targetType === "external") { if (typeof require !== "undefined") { require("electron").shell.openExternal(app.target); } else if (api && api.openExternal) { api.openExternal(app.target); } else { window.open(app.target, "_blank"); } } else if (app.targetType === "folder" || app.targetType === "app") { if (api && api.openPath) { api.openPath(app.target).then(function(err){ if (err) showNotificationExp("⚠️ Introuvable: " + err); }); } else if (typeof require !== "undefined") { require("electron").shell.openPath(app.target).then(function(err){ if (err) showNotificationExp("⚠️ Introuvable: " + err); }); } else { showNotificationExp("⚠️ Ouverture disponible uniquement dans l'app Electron"); } } else if (app.targetType === "hub") { var hubUrl = "hub-" + app.target + ".html?parent=" + encodeURIComponent(window.location.pathname) + "&title=" + encodeURIComponent(app.name) + "&mode=mobile"; if (isElectronExp) { api.send("navigate-to-module", hubUrl); } else { window.location.href = hubUrl; } } else { var sep = app.target.indexOf("?") !== -1 ? "&" : "?"; var pageUrl = app.target + sep + "parent=" + encodeURIComponent(window.location.href) + "&title=" + encodeURIComponent(app.name); if (isElectronExp) { api.send("navigate-to-module", pageUrl); } else { window.location.href = pageUrl; } } }
var preloadPathCacheExp = null;
async function getPreloadPathExp() { if (!isElectronExp || !api.getPreloadPath) return null; if (preloadPathCacheExp) return preloadPathCacheExp; try { preloadPathCacheExp = await api.getPreloadPath(); } catch (e) { console.warn("get-preload-path a échoué:", e); preloadPathCacheExp = null; } return preloadPathCacheExp; }
async function openStudioViewerExp(app) { document.getElementById("studioViewerTitle").textContent = app.name; var oldFrame = document.getElementById("studioViewerFrame"); if (isElectronExp) { var preloadPath = await getPreloadPathExp(); var webview = document.createElement("webview"); webview.id = "studioViewerFrame"; webview.className = "studio-viewer-frame"; webview.setAttribute("allowpopups", ""); webview.setAttribute("webpreferences", "contextIsolation=yes, nodeIntegration=no"); if (preloadPath) webview.setAttribute("preload", preloadPath); webview.setAttribute("src", app.target); oldFrame.replaceWith(webview); } else { var iframe = document.createElement("iframe"); iframe.id = "studioViewerFrame"; iframe.className = "studio-viewer-frame"; iframe.src = app.target; oldFrame.replaceWith(iframe); } document.getElementById("studioViewer").classList.add("active"); showNotificationExp("🚀 Ouverture: " + app.name); }
function closeStudioViewer() { document.getElementById("studioViewer").classList.remove("active"); var frame = document.getElementById("studioViewerFrame"); if (frame) frame.src = "about:blank"; showNotificationExp("← Retour au hub"); }
function returnToParentHub() { if (isElectronExp) { api.send("navigate-to-module", parentHubUrl); } else { window.location.href = parentHubUrl; } }
function showNotificationExp(msg) { var n = document.getElementById("notification"); n.textContent = msg; n.classList.add("show"); setTimeout(function(){ n.classList.remove("show"); }, 3000); }
function updateTimeExp() { var el = document.getElementById("currentTime"); if (el) { el.textContent = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); } }
document.addEventListener("keydown", function(e){ if (e.key === "Escape") { if (document.getElementById("studioViewer").classList.contains("active")) { closeStudioViewer(); } else { returnToParentHub(); } } });
renderExp(); updateTimeExp(); setInterval(updateTimeExp, 1000);
</script>
</body>
</html>
