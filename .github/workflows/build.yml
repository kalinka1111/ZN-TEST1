name: Build ZNK

permissions:
  contents: write

# Se déclenche automatiquement quand vous poussez un tag de version
# (ex: git tag v1.0.1 && git push origin v1.0.1)
# OU manuellement depuis l'onglet "Actions" sur GitHub (bouton "Run workflow")
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version (ex: 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Télécharge les morceaux de ressources depuis R2
        run: |
          curl -L -o znk-resources.part-aa https://cdn.znk.systems/znk-resources.part-aa
          curl -L -o znk-resources.part-ab https://cdn.znk.systems/znk-resources.part-ab

      - name: Recolle les morceaux et extrait
        run: |
          cat znk-resources.part-aa znk-resources.part-ab > znk-resources.zip
          unzip -q znk-resources.zip -d .

      - name: Installe les dépendances
        run: npm ci

      - name: Build Mac (.dmg)
        run: npm run build:mac -- --publish=never

      - name: Upload le résultat (artifact temporaire)
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: desktop/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Télécharge les morceaux de ressources depuis R2
        run: |
          curl -L -o znk-resources.part-aa https://cdn.znk.systems/znk-resources.part-aa
          curl -L -o znk-resources.part-ab https://cdn.znk.systems/znk-resources.part-ab

      - name: Recolle les morceaux et extrait
        shell: pwsh
        run: |
          cmd /c copy /b znk-resources.part-aa+znk-resources.part-ab znk-resources.zip
          Expand-Archive -Path znk-resources.zip -DestinationPath . -Force

      - name: Installe les dépendances
        run: npm ci

      - name: Build Windows (.exe)
        run: npm run build:win -- --publish=never

      - name: Upload le résultat (artifact temporaire)
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: desktop/*.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le build Mac
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: dist

      - name: Récupère le build Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Détermine le numéro de version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publie la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

      - name: Prépare les fichiers latest.json (auto-update)
        run: |
          DMG_FILE=$(basename $(ls dist/*.dmg))
          EXE_FILE=$(basename $(ls dist/*.exe))
          DMG_SIZE=$(stat -c%s "dist/$DMG_FILE")
          EXE_SIZE=$(stat -c%s "dist/$EXE_FILE")
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > latest-mac.json << EOF
          {
            "version": "$VERSION",
            "releaseDate": "$NOW",
            "downloadUrl": "https://github.com/$REPO/releases/download/v$VERSION/$DMG_FILE",
            "fileSize": $DMG_SIZE,
            "prerelease": false
          }
          EOF

          cat > latest-win.json << EOF
          {
            "version": "$VERSION",
            "releaseDate": "$NOW",
            "downloadUrl": "https://github.com/$REPO/releases/download/v$VERSION/$EXE_FILE",
            "fileSize": $EXE_SIZE,
            "prerelease": false
          }
          EOF

      - name: Publie latest.json vers R2 (pour l'auto-update)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp latest-mac.json s3://znk-archives/latest-mac.json --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          aws s3 cp latest-win.json s3://znk-archives/latest-win.json --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
