name: Build ZNK

# Se déclenche automatiquement quand vous poussez un tag de version
# (ex: git tag v1.0.1 && git push origin v1.0.1)
# OU manuellement depuis l'onglet "Actions" sur GitHub (bouton "Run workflow")
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version (ex: 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Télécharge les morceaux de ressources depuis R2
        run: |
          curl -L -o znk-resources.partaa https://cdn.znk.systems/znk-resources.partaa
          curl -L -o znk-resources.partab https://cdn.znk.systems/znk-resources.partab
          curl -L -o znk-resources.partac https://cdn.znk.systems/znk-resources.partac
          curl -L -o znk-resources.partad https://cdn.znk.systems/znk-resources.partad

      - name: Recolle les morceaux et extrait
        run: |
          cat znk-resources.partaa znk-resources.partab znk-resources.partac znk-resources.partad > znk-resources.zip
          unzip -q znk-resources.zip -d .

      - name: Installe les dépendances
        run: npm ci

      - name: Build Mac (.dmg)
        run: npm run build:mac -- --publish=never

      - name: Upload le résultat (artifact temporaire)
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: desktop/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Télécharge les morceaux de ressources depuis R2
        run: |
          curl -L -o znk-resources.partaa https://cdn.znk.systems/znk-resources.partaa
          curl -L -o znk-resources.partab https://cdn.znk.systems/znk-resources.partab
          curl -L -o znk-resources.partac https://cdn.znk.systems/znk-resources.partac
          curl -L -o znk-resources.partad https://cdn.znk.systems/znk-resources.partad

      - name: Recolle les morceaux et extrait
        shell: pwsh
        run: |
          cmd /c copy /b znk-resources.partaa+znk-resources.partab+znk-resources.partac+znk-resources.partad znk-resources.zip
          Expand-Archive -Path znk-resources.zip -DestinationPath . -Force

      - name: Installe les dépendances
        run: npm ci

      - name: Build Windows (.exe)
        run: npm run build:win -- --publish=never

      - name: Upload le résultat (artifact temporaire)
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: desktop/*.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le build Mac
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: dist

      - name: Récupère le build Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Détermine le numéro de version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publie la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
