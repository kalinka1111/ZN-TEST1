<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>©ZNK - Dashboard Etudes (Prof)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root{
            --znk-bg-primary: #000000;
            --znk-bg-secondary: #ffaa00;
            --znk-bg-card: #5a1c00;
            --znk-accent: #831100;
            --znk-accent-hover: #c0c0c0;
            --znk-text-primary: #ffffff;
            --znk-text-secondary: #ffaa00;
            --znk-text-muted: #00a3d7;
            --znk-border: #a77b00;
            --znk-glass: #3e2a0f;
        }

        body{
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #5c0700 0%, #561029 50%, #232323 100%);
            color: var(--znk-text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header{
            background: var(--znk-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--znk-border);
            padding: 12px 16px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px #b51a00;
        }

        .header-left{ display:flex; align-items:center; gap:12px; }
        .logo{ font-size:24px; font-weight:700; color:var(--znk-accent); cursor:pointer; }

        .search-container{ position:relative; width:280px; }
        .search-input{
            width:100%;
            padding:8px 16px 8px 40px;
            background:var(--znk-bg-card);
            border:1px solid var(--znk-border);
            border-radius:20px;
            color:var(--znk-text-primary);
            font-size:14px;
            outline:none;
            transition:all 0.2s ease;
        }
        .search-input:focus{ border-color:var(--znk-accent); box-shadow: 0 0 0 2px #5c0700; }

        .header-right{ display:flex; align-items:center; gap:8px; }
        .header-btn{
            width:65px; height:65px; border-radius:50%;
            background:var(--znk-bg-card); border:none; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            transition:all 0.2s ease; overflow:hidden; position:relative;
        }
        .header-btn:hover{
            background:var(--znk-accent); transform:translateY(-2px); box-shadow:0 4px 12px #3d3e41;
        }
        .header-btn img{ width:53px; height:53px; object-fit:contain; }
       
        .niveau-selector{ position:relative; }
        .niveau-btn{
            height:45px; padding:0 16px; border-radius:20px;
            background:var(--znk-bg-card); border:none; cursor:pointer;
            display:flex; align-items:center; gap:8px; color:var(--znk-text-primary);
            font-size:13px; font-weight:600; transition:all 0.2s ease;
        }
        .niveau-btn:hover{ background:var(--znk-accent); transform:translateY(-2px); }
        .niveau-icon-static{ width:22px; height:22px; object-fit:contain; flex-shrink:0; }
        .niveau-menu{
            position:absolute; top:60px; right:0;
            background:var(--znk-bg-card); border:1px solid var(--znk-border);
            border-radius:12px; padding:8px; min-width:220px; display:none; z-index:2000;
            box-shadow:0 8px 24px rgba(0,0,0,0.5);
        }
        .niveau-menu.active{ display:block; }
        .niveau-option{ display:flex; align-items:center; gap:10px; padding:12px; border-radius:8px; cursor:pointer; margin-bottom:4px; transition:all .2s ease; font-size:13px; }
        .niveau-option:hover{ background:rgba(255,255,255,0.06); }
        .niveau-option.active{ background:var(--znk-accent); font-weight:700; }
        .niveau-option .niveau-auto-tag{ font-size:10px; opacity:0.7; margin-left:auto; }

        .user-avatar-btn{
            width:48px; height:48px; border-radius:50%;
            background: linear-gradient(135deg, var(--znk-accent), #9a244f);
            border:2px solid #5c0700; cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:all .2s ease; overflow:hidden;
        }
        .user-avatar-btn:hover{ transform:scale(1.1); box-shadow:0 0 20px #5c0700; }
        .user-avatar-btn img{ width:100%; height:100%; object-fit:cover; }

        /* MAIN LAYOUT
           Default: two columns (left nav + main content).
           Right sidebar only appears when .show-sidebar-right class is present on .main-layout.
        */
        .main-layout{
            margin-top: 60px;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 24px;
            padding: 24px;
            max-width: 1700px;
            margin-left: auto; margin-right: auto;
            transition: grid-template-columns 0.3s ease;
            height: calc(100vh - 84px);
        }

        /* When active, show right sidebar */
        .main-layout.show-sidebar-right{
            grid-template-columns: 120px 1fr 380px;
        }

        .sidebar-left{
            position: sticky; top: 80px;
            height: fit-content; max-height: calc(100vh - 100px); overflow-y: auto;
        }

        .nav-section{
            background: var(--znk-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border); border-radius: 16px; padding: 16px; margin-bottom: 16px;
            display:flex; flex-direction:column; gap:12px;
        }
        .nav-link{
            display:flex; align-items:center; justify-content:center;
            padding:8px; border-radius:12px; color:var(--znk-text-secondary);
            text-decoration:none; transition:all .3s ease; cursor:pointer; position:relative;
        }
        .nav-link:hover, .nav-link.active{ background:#5c0700; transform:scale(1.05); box-shadow:0 4px 12px #5c0700; }

        .icon-placeholder{
            width:70px; height:70px; border-radius:12px;
            background: linear-gradient(135deg, #5c0700, #ad3e00);
            display:flex; align-items:center; justify-content:center; border:1px solid #5c0700; overflow:hidden;
            transition:all .3s ease;
        }
        .icon-placeholder img{ width:100%; height:100%; object-fit:contain; border-radius:inherit; }

        /* --- Mise en avant des modules PROF (prof / dash / leconc) --- */
        .nav-section-prof{
            border: 2px solid var(--znk-accent-hover);
            box-shadow: 0 0 16px rgba(102,156,53,0.45);
            position: relative;
        }
        .nav-section-prof::before{
            content: "ESPACE PROF";
            display:block; text-align:center;
            font-size:10px; font-weight:700; letter-spacing:1px;
            color: var(--znk-accent-hover); margin-bottom:4px;
        }
        .nav-section-prof .nav-link{ gap:4px; flex-direction:column; }
        .nav-section-prof .icon-placeholder{
            width:78px; height:78px;
            border-color: var(--znk-accent-hover);
            box-shadow: 0 0 8px rgba(102,156,53,0.35);
        }
        .nav-section-prof .nav-label{
            font-size:9px; color: var(--znk-text-primary); text-transform:uppercase;
            letter-spacing:.5px; text-align:center;
        }
        .nav-section-standard{ opacity:0.85; }
        .nav-section-standard .icon-placeholder{ width:56px; height:56px; }

        @media (max-width:768px){
            .nav-section-prof .icon-placeholder{ width:56px; height:56px; }
            .nav-section-standard .icon-placeholder{ width:44px; height:44px; }
            .nav-label{ display:none; }
        }

        .module-container{
            background: var(--znk-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border); border-radius: 16px; overflow: hidden;
            height: 100%; display:flex; flex-direction:column;
        }

        /* Ensure iframe can size correctly inside flex container */
        #moduleContainer{
            width:100%; flex:1; overflow:hidden; padding:0; position:relative; min-height:0;
        }
        #moduleContainer iframe{ width:100%; height:100%; border:none; border-radius:12px; display:block; }

        .module-loading{ display:flex; align-items:center; justify-content:center; flex-direction:column; height:100%; width:100%; }
        .spinner{ width:40px; height:40px; border:4px solid var(--znk-border); border-top-color:var(--znk-accent); border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
        .spinner-text{ margin-top:16px; color:var(--znk-text-secondary); font-size:14px; }

        /* Right sidebar hidden by default. When .show is present it becomes visible. */
        .sidebar-right{
            position: sticky; top:80px; height: fit-content; max-height: calc(100vh - 100px);
            overflow-y: auto; transition: all .3s ease; display: none;
        }
        .sidebar-right.show{ display: block; }

        .widget{
            background: var(--znk-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--znk-border); border-radius: 16px; padding: 20px; margin-bottom: 16px;
        }
        .widget-title{ font-size:14px; font-weight:600; color:var(--znk-accent); margin-bottom:15px; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; justify-content:space-between; }
        .widget-subtitle{ font-size:11px; color:var(--znk-text-muted); font-weight:400; }
        .widget-item{ display:flex; align-items:center; gap:12px; padding:10px; border-radius:8px; cursor:pointer; transition:all .2s ease; margin-bottom:4px; border:1px solid transparent; }
        .widget-item:hover{ background:#5c0700; border-color:var(--znk-border); transform:translateX(4px); }
        .widget-avatar{ width:40px; height:40px; border-radius:50%; background: linear-gradient(135deg, var(--znk-accent), #c0c0c0); display:flex; align-items:center; justify-content:center; font-weight:600; color:white; font-size:14px; overflow:hidden; flex-shrink:0; }
        .widget-avatar img{ width:100%; height:100%; object-fit:cover; }
        .widget-info{ flex:1; min-width:0; }
        .widget-name{ font-size:13px; font-weight:600; margin-bottom:3px; color:var(--znk-text-primary); }
        .widget-desc{ font-size:11px; color:var(--znk-text-muted); display:flex; align-items:center; gap:4px; }
        .badge{ display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:600; background:var(--znk-accent); color:#000; }

        .stats-bar{ display:flex; gap:16px; padding:12px; background:rgba(0,0,0,0.2); border-radius:8px; margin-top:12px; }
        .stat-item{ text-align:center; flex:1; }
        .stat-value{ font-size:18px; font-weight:700; color:var(--znk-accent); }
        .stat-label{ font-size:10px; color:var(--znk-text-muted); text-transform:uppercase; }

        @media (max-width:1200px){
            .main-layout.show-sidebar-right{ grid-template-columns: 120px 1fr 320px; }
        }

        @media (max-width:768px){
            .main-layout, .main-layout.show-sidebar-right{ grid-template-columns: 1fr; padding:12px; gap:12px; padding-bottom:90px; }
            .sidebar-left{
                position: fixed; bottom: 0; left: 0; right: 0; top: auto; width: 100%; height: auto; max-height: 80px; z-index: 900;
                background: var(--znk-glass); border-top:1px solid var(--znk-border); backdrop-filter: blur(20px);
            }
            .nav-section{ flex-direction:row; flex-wrap:wrap; justify-content:center; margin-bottom:0; padding:8px; }
            .icon-placeholder{ width:50px; height:50px; }
            .search-container, #statTime{ display:none; }
            .sidebar-right{ display:none !important; }
        }

        ::-webkit-scrollbar{ width:8px; height:8px; }
        ::-webkit-scrollbar-track{ background:#b51a00; border-radius:10px; }
        ::-webkit-scrollbar-thumb{ background:#5c0700; border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover{ background:var(--znk-accent); }
    </style>
    <!-- ZNK P2P Manager -->
<script src="./js/znk-p2p-manager.js"></script>
<script src="./ZNKAuthSystem/znk-session.js"></script>
<script>
    // Initialiser le manager P2P global
    let znkP2P = null;
    
    document.addEventListener('DOMContentLoaded', () => {
        znkP2P = new ZNKP2PManager({
            apiUrl: 'https://api.znk.app/v1'  // Votre URL API
        });
        
        console.log('📡 P2P Manager initialisé');
        
        // Afficher les stats dans la console
        const stats = znkP2P.getStats();
        console.log('📊 Stats P2P:', stats);
    });
</script>

    <script>
        // Compte Admin Enseignant officiel (persistant) : seul compte à voir les
        // outils admin des leçons (création admin + import en masse). Tous les
        // autres comptes 'enseignant' restent sur les outils standard.
        const SUPER_PROF_ID = 'ZNK-2026-6020'; // artetudes@echo.znk
        function isSuperProf() {
            try {
                const account = JSON.parse(localStorage.getItem('znk_account') || '{}');
                return account.idZNK === SUPER_PROF_ID;
            } catch (e) { return false; }
        }

        const MODULES_CONFIG = {
            'user-profile': { name: 'Mon Profil', path: './modules/user-profile.html' },
            'hub-profs': { name: 'Smartphone', path: './hub-profs.html', openAsHub: true },
            'parents': { name: 'Parents', path: './modules-etudes/parents.html' },
            'whatsznk': { name: 'WhatsZNK', path: './WhatsZNK.html' },
            'parametres': { name: 'Paramètres', path: './parametres.html' },
            'infos-user': { name: 'Infos', path: './infos-user.html' },
            'nomad': { name: 'Bank', path: './modules/nomad.html' },
            'affiche': { name: 'affiche', path: './modules/affiche.html' },           
            'artflow-publish-etudes': { name: 'artflow-publish-etudes', path: './modules-etudes/artflow-publish-etudes.html' },
            'artflow-etudes': { name: 'artflow-etudes', path: './artflow-etudes.html' },
            'etudes': { name: 'ETUDES', path: './modules-etudes/etudes.html' },
            'livremoi': { name: 'LIVREmoi', path: './modules-etudes/ZNK-LIVREmoi.html' },
            'elevesart': { name: 'elevesart', path: './elevesArt.html' },
            'terminal-professeurs': { name: 'terminal-professeurs', path: './modules-etudes/terminal-professeurs.html' },
            'terminal-interrogations': { name: 'Interrogations', path: './modules-etudes/terminal-interrogations.html' },
            'terminal-lecons': { name: 'terminal-lecons', path: './modules-etudes/terminal-lecons.html' },
             'creer-lecon': { name: 'creer-lecon', path: './modules-etudes/creer-lecon.html' },
            'import-lecons': { name: 'Import Leçons', path: './modules-etudes/import-lecons-interrogations.html' },
            'professeur': { name: 'Professeur', path: './modules-etudes/professeur.html' }
        };

        // Theme menu
        function toggleThemeMenu() {
            const menu = document.getElementById('themeMenu');
            menu.classList.toggle('active');
        }
        document.addEventListener('click', (e) => {
            const themeSelector = document.querySelector('.theme-selector');
            const menu = document.getElementById('themeMenu');
            if (themeSelector && !themeSelector.contains(e.target)) menu.classList.remove('active');

            const niveauSelector = document.querySelector('.niveau-selector');
            const niveauMenu = document.getElementById('niveauMenu');
            if (niveauSelector && !niveauSelector.contains(e.target)) niveauMenu.classList.remove('active');
        });

        // ===== Gestion du niveau côté PROF =====
        // Le prof peut enseigner/gérer plusieurs classes de niveaux différents.
        // Le niveau "actif" (choisi ici) sert à : (1) router le module ETUDES vers le
        // bon ArtEtudes-*.html, (2) notifier le module actuellement ouvert
        // (terminal-lecons, terminal-interrogations, professeur...) du niveau ciblé,
        // pour qu'il publie/filtre son contenu pour la bonne classe.

        // Correspondance niveau précis -> groupe de niveau
        const NIVEAU_TO_GROUPE = {
            ps: 'maternelle', ms: 'maternelle', gs: 'maternelle',
            cp: 'primaire', ce1: 'primaire', ce2: 'primaire', cm1: 'primaire', cm2: 'primaire',
            '6eme': 'college', '5eme': 'college', '4eme': 'college', '3eme': 'college',
            seconde: 'lycee', premiere: 'lycee', terminale: 'lycee'
        };

        const NIVEAU_GROUPE_LABELS = {
            maternelle: { icon: '🎨', label: 'maternelle' },
            primaire: { icon: '📚', label: 'Primaire' },
            college: { icon: '🎓', label: 'Collège' },
            lycee: { icon: '🏫', label: 'Lycée' }
        };

        // Fichiers dashboard-études par niveau (fallback etudes.html si niveau inconnu)
        const ARTETUDES_FILES = {
            maternelle: './modules-etudes/ArtEtudes-maternelle.html',
            primaire: './modules-etudes/ArtEtudes-Primaire.html',
            college: './modules-etudes/ArtEtudes-College.html',
            lycee: './modules-etudes/ArtEtudes-lycee.html'
        };

        // Détecte le niveau "par défaut" du compte prof : le niveau qu'il enseigne
        // principalement (znk_account.niveauEnseigne), sinon rien (le prof choisit
        // manuellement via le bouton "Niveau" s'il gère plusieurs classes).
        function detectAccountNiveauGroupe() {
            try {
                const accountRaw = localStorage.getItem('znk_account');
                if (accountRaw) {
                    const account = JSON.parse(accountRaw);
                    if (account.role === 'enseignant' && account.niveauEnseigne && NIVEAU_TO_GROUPE[account.niveauEnseigne]) {
                        return NIVEAU_TO_GROUPE[account.niveauEnseigne];
                    }
                    if (account.niveauGroupe) return account.niveauGroupe;
                }
            } catch (e) {
                console.warn('Impossible de déterminer le niveau du compte prof', e);
            }
            return null;
        }

        function getEtudesPath() {
            const override = localStorage.getItem('znk_niveau_override');
            const groupe = override || detectAccountNiveauGroupe();
            return ARTETUDES_FILES[groupe] || './modules-etudes/etudes.html';
        }

        function currentNiveauGroupe() {
            return localStorage.getItem('znk_niveau_override') || detectAccountNiveauGroupe();
        }

        function toggleNiveauMenu() {
            document.getElementById('niveauMenu').classList.toggle('active');
        }

        function updateNiveauBtnLabel() {
            const groupe = currentNiveauGroupe();
            const isOverride = !!localStorage.getItem('znk_niveau_override');
            const info = NIVEAU_GROUPE_LABELS[groupe];

            document.getElementById('niveauBtnIcon').textContent = info ? info.icon : '🎓';
            document.getElementById('niveauBtnLabel').textContent = info ? info.label : 'Niveau';

            document.querySelectorAll('.niveau-option').forEach(opt => {
                const optGroupe = opt.getAttribute('data-niveau');
                opt.classList.toggle('active', isOverride ? optGroupe === groupe : optGroupe === '');
            });
        }

        // Notifie le module actuellement chargé (iframe ou webview) du changement de
        // niveau, pour que terminal-lecons / terminal-interrogations / professeur
        // puissent filtrer/publier leur contenu pour la bonne classe.
        function broadcastNiveauChange() {
            const groupe = currentNiveauGroupe();
            const container = document.getElementById('moduleContainer');
            if (!container) return;
            const frame = container.querySelector('iframe, webview');
            if (frame && frame.contentWindow && typeof frame.contentWindow.postMessage === 'function') {
                try {
                    frame.contentWindow.postMessage({ action: 'niveauChanged', niveauGroupe: groupe }, '*');
                } catch (e) {
                    console.warn('Impossible de notifier le module du changement de niveau', e);
                }
            }
        }

        // Choix manuel du niveau géré. '' = retour au mode automatique (niveau enseigné).
        function setNiveauOverride(groupe) {
            if (groupe) {
                localStorage.setItem('znk_niveau_override', groupe);
            } else {
                localStorage.removeItem('znk_niveau_override');
            }
            updateNiveauBtnLabel();
            document.getElementById('niveauMenu').classList.remove('active');

            // Si le module ETUDES est déjà ouvert, on le recharge avec le nouveau niveau
            const activeLink = document.querySelector('.nav-link.active');
            if (activeLink && activeLink.getAttribute('onclick') === "loadModule('etudes')") {
                loadModule('etudes');
            }

            // Sinon on notifie simplement le module ouvert (terminal-lecons, etc.)
            broadcastNiveauChange();
        }

        function changeTheme(theme){
            const themeFiles = {
                'default': 'ZNKartEtudesDash.html',
                'purple': 'dash-etudes-purple.html',
                'blue': 'dash-etudes-blue.html',
                'green': 'dash-etudes-green.html'
            };
            if (themeFiles[theme]) window.location.href = themeFiles[theme];
        }

        /**
         * Core: show the right column ONLY for the user-profile module.
         * - When moduleName === 'user-profile' we add:
         *     mainLayout.classList.add('show-sidebar-right')
         *     sidebarRight.classList.add('show')
         * - For all other modules we remove the above classes so the layout becomes 2-column again.
         *
         * Also we set aria-hidden attribute appropriately to help accessibility and to avoid layout glitches.
         */
        function loadModule(moduleName){
            const moduleConfigCheck = MODULES_CONFIG[moduleName];

            // Un "hub" (mockup téléphone plein écran, avec sa propre barre de retour)
            // n'est pas conçu pour être encapsulé comme un widget dans la colonne
            // centrale à côté des sidebars — sa mise en page (hauteur 100vh, cadre
            // téléphone) suppose qu'il occupe la fenêtre entière. On le charge donc
            // en navigation complète plutôt qu'en <webview>/<iframe> intégré.
            if (moduleConfigCheck && moduleConfigCheck.openAsHub) {
                window.location.href = moduleConfigCheck.path;
                return;
            }

            const container = document.getElementById('moduleContainer');
            const sidebarRight = document.getElementById('sidebarRight');
            const mainLayout = document.getElementById('mainLayout');

            if (moduleName === 'user-profile') {
                if (mainLayout) mainLayout.classList.add('show-sidebar-right');
                if (sidebarRight) { sidebarRight.classList.add('show'); sidebarRight.setAttribute('aria-hidden', 'false'); }
            } else {
                if (mainLayout) mainLayout.classList.remove('show-sidebar-right');
                if (sidebarRight) { sidebarRight.classList.remove('show'); sidebarRight.setAttribute('aria-hidden', 'true'); }
            }

            // Le module ETUDES pointe vers un fichier différent selon le niveau
            // actuellement géré par le prof (override manuel via le bouton "Niveau",
            // sinon niveau enseigné par défaut sur le compte).

        // Le compte Admin Enseignant (artetudes@echo.znk, voir SUPER_PROF_ID) publie
// pour toutes les classes de l'app, via l'outil admin plutôt que l'outil
// standard par école/prof.
function getCreerLeconPath() {
    return isSuperProf() ? './modules-etudes/creer-lecon-admin.html' : './modules-etudes/creer-lecon.html';
}
           const moduleConfig = moduleName === 'etudes'
    ? { name: 'ETUDES', path: getEtudesPath(), needsElectronAPI: MODULES_CONFIG.etudes.needsElectronAPI }
    : moduleName === 'creer-lecon'
        ? { name: 'creer-lecon', path: getCreerLeconPath(), needsElectronAPI: MODULES_CONFIG['creer-lecon'].needsElectronAPI }
        : MODULES_CONFIG[moduleName];
            if (!moduleConfig) {
                container.innerHTML = `<div class="module-loading"><div style="font-size:48px">⚠️</div><div>Module introuvable</div></div>`;
                setActiveModule(null);
                return;
            }

            container.innerHTML = `<div class="module-loading"><div class="spinner"></div><div class="spinner-text">Chargement de ${moduleConfig.name}...</div></div>`;

            // Modules qui ont besoin de window.electronAPI (ex: terminal-professeurs, et
            // par défaut tous les autres) doivent être chargés en <webview> avec leur PROPRE
            // preload : une <iframe> classique ne reçoit jamais le preload de la fenêtre
            // parente dans Electron.
            //
            // Comportement : webview (avec electronAPI) PAR DÉFAUT pour tout module.
            // Pour désactiver explicitement sur un module qui n'en a pas besoin,
            // ajoute `needsElectronAPI: false` dans sa config dans MODULES_CONFIG.
            setTimeout(async () => {
                const needsElectronAPI = moduleConfig.needsElectronAPI !== false;

                if (needsElectronAPI && window.electronAPI && typeof window.electronAPI.getPreloadPath === 'function') {
                    try {
                        const preloadUrl = await window.electronAPI.getPreloadPath();
                        container.innerHTML = `
                            <webview
                                src="${moduleConfig.path}"
                                preload="${preloadUrl}"
                                webpreferences="contextIsolation=yes, nodeIntegration=no"
                                style="width:100%; height:100%; border:none;"
                                title="${moduleConfig.name}"
                            ></webview>
                        `;
                    } catch (err) {
                        console.error('❌ Impossible de récupérer le chemin du preload, fallback iframe:', err);
                        container.innerHTML = `<iframe src="${moduleConfig.path}" title="${moduleConfig.name}"></iframe>`;
                    }
                } else {
                    container.innerHTML = `<iframe src="${moduleConfig.path}" title="${moduleConfig.name}"></iframe>`;
                }
                setActiveModule(moduleName);
                // On informe le module fraîchement chargé du niveau actif
                setTimeout(broadcastNiveauChange, 400);
            }, 250);
        }

        function setActiveModule(moduleName){
            // clear previous active
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));

            if (!moduleName) return;

            // Find the placeholder inside nav-link with matching data-role
            const el = document.querySelector(`.nav-link [data-role="${moduleName}"]`);
            if (el && el.closest('.nav-link')){
                el.closest('.nav-link').classList.add('active');
            } else {
                // fallback: if there's a nav-link with onclick containing the moduleName, mark it active
                const possible = Array.from(document.querySelectorAll('.nav-link')).find(n => {
                    const onclick = n.getAttribute('onclick') || '';
                    return onclick.indexOf(`loadModule('${moduleName}')`) !== -1;
                });
                if (possible) possible.classList.add('active');
            }
        }

        function goHome(){ loadModule('professeurs'); }
        function openUserInfos(){ loadModule('infos-user'); }

        // Permet à un module enfant (terminal-professeurs.html, etc., chargé en
        // <webview> ou <iframe>) de demander l'ouverture d'un autre module DANS
        // LA MÊME FENÊTRE, sans navigation ni popup.
        // Depuis le module enfant, il suffit d'envoyer :
        //   window.parent.postMessage({ action: 'loadModule', module: 'terminal-interrogations' }, '*');
        // (si le module tourne en <webview> Electron avec contextIsolation, utiliser
        //  l'API exposée par le preload pour relayer ce postMessage vers window.top)
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data && data.action === 'loadModule' && typeof data.module === 'string') {
                loadModule(data.module);
            }
        });

        // Apply icons from manifest (kept compatible with previous behavior)
        async function applyIconsFromManifest(){
            try {
                const manifestPath = './icons/icons-intro-manifest.json';
                const res = await fetch(manifestPath);
                if (!res.ok) return;
                const data = await res.json();
                const icons = Array.isArray(data.icons) ? data.icons : Object.values(data.icons || {});
                icons.forEach(ic => {
                    const candidates = [ic.id, ic.name, ic.filename, ic.src, ic.role].filter(Boolean);
                    candidates.forEach(c => {
                        const role = String(c).replace(/\.(png|jpg|jpeg|svg)$/i, '').toLowerCase();
                        const elements = document.querySelectorAll(`.icon-placeholder[data-role="${role}"]`);
                        elements.forEach(el => {
                            let iconSrc = ic.src || ic.filename || ic.path;
                            if (iconSrc && !iconSrc.startsWith('./') && !iconSrc.startsWith('http')) iconSrc = `./icons/${iconSrc}`;
                            else if (!iconSrc) iconSrc = `./icons/${role}.svg`;
                            el.innerHTML = `<img src="${iconSrc}" alt="${role}">`;
                            el.style.background = 'transparent';
                            el.style.border = 'none';
                        });
                    });
                });
            } catch (e) {
                console.warn('Erreur chargement manifest:', e);
            }
        }

        function updateTime(){
            const t = document.getElementById('statTime');
            if (t) t.textContent = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        }

        // N'affiche l'icône Import qu'au compte Admin Enseignant — masquée pour
        // tous les autres profs, qui ne savent même pas que l'outil existe.
        function showAdminProfModules() {
            const el = document.getElementById('navImportLecons');
            if (el && isSuperProf()) el.style.display = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize
            updateTime();
            setInterval(updateTime, 1000);
            applyIconsFromManifest();
            updateNiveauBtnLabel();
            showAdminProfModules();

            // Dashboard Prof : on ouvre directement l'espace prof au démarrage
            loadModule('professeur');

            // Afficher la photo de l'utilisateur dans l'avatar du header,
            // si elle a été définie dans les paramètres (infos-user.html).
            applyHeaderAvatar();
        });

        async function applyHeaderAvatar() {
            try {
                if (!window.ZNKSession) return;
                await window.ZNKSession.ready;
                const user = window.ZNKSession.getCurrentUser();
                if (user && user.avatar) {
                    const img = document.querySelector('#userAvatar img');
                    if (img) img.src = user.avatar;
                }
            } catch (e) { console.warn('⚠️ Avatar header: ZNKSession indisponible:', e); }
        }
    </script>
</body>
